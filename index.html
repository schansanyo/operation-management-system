/* ---------- layout ---------- */
#shell{display:flex; min-height:100vh; min-height:100dvh;}
#sidebar{
  width:216px; flex-shrink:0; background:var(--steel); color:#c9d3d6;
  display:flex; flex-direction:column; position:fixed; top:0; bottom:0; left:0;
}
#brand{padding:16px 20px 14px 20px; border-bottom:1px solid #2c3941;}
#logo-card{padding:0; display:inline-block;}
#logo-card img{display:block; width:100%; max-width:176px; height:auto;}
#brand .mark{
  display:flex; align-items:center; gap:8px; color:#fff;
  font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:21px; letter-spacing:.04em;
}
#brand .mark .chip{width:9px; height:9px; background:var(--accent); display:inline-block; transform:rotate(45deg);}
#brand .tag{margin-top:2px; font-size:10.5px; color:#8fa0a7; letter-spacing:.14em; text-transform:uppercase;}

nav{padding:14px 10px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:11px 12px; margin-bottom:3px;
  border-radius:3px; cursor:pointer; color:#a9b7bc; font-size:12.5px; letter-spacing:.05em;
  text-transform:uppercase; font-weight:600; border-left:3px solid transparent;
  transition:background .12s, color .12s;
}
.nav-item svg{width:15px; height:15px; flex-shrink:0; opacity:.85;}
.nav-item:hover{background:#202c34; color:#e7edee;}
.nav-item.active{background:var(--steel-2); color:#fff; border-left-color:var(--accent);}
.nav-item .count{
  margin-left:auto; background:#0f171c; color:#8fa0a7; font-family:'IBM Plex Mono',monospace;
  font-size:10.5px; padding:1px 6px; border-radius:8px;
}
.nav-item.active .count{background:var(--accent); color:#fff;}

#sidebar-foot{padding:14px 20px; border-top:1px solid #2c3941; font-size:11px; color:#71838a;}
#save-indicator.flash{animation:save-flash .6s ease;}
@keyframes save-flash{ 0%{color:#c9d3d6;} 100%{color:#6f9a7c;} }

#main{margin-left:216px; flex:1; min-width:0;}
#topbar{
  background:var(--bg-2); border-bottom:1px solid var(--line); padding:18px 32px;
  padding-top:calc(18px + env(safe-area-inset-top, 0px));
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20;
}
#topbar h1{margin:0; font-size:26px;}
#topbar .sub{color:var(--ink-soft); font-size:12px; margin-top:2px;}
.shift-chip{
  display:flex; align-items:center; gap:8px; background:#f4f6f5; border:1px solid var(--line);
  padding:7px 12px; border-radius:4px; font-size:11.5px; color:var(--ink-soft);
}
.shift-chip .dot{width:7px; height:7px; border-radius:50%; background:var(--ok);}
#content{padding:28px 32px 60px 32px; padding-bottom:calc(60px + env(safe-area-inset-bottom, 0px));}

/* ---------- generic bits ---------- */
.panel{background:var(--panel); border:1px solid var(--line); border-radius:6px;}
.panel-head{
  padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center;
  justify-content:space-between;
}
.panel-head h2{margin:0; font-size:14px; text-transform:uppercase; letter-spacing:.07em; font-weight:700;}
.panel-body{padding:16px 18px;}
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:20px;
  font-size:11px; font-weight:600; letter-spacing:.02em; white-space:nowrap;
}
.pill.gray{background:#eceff0; color:#5b6b74;}
.pill.accent{background:var(--accent-soft); color:var(--accent);}
.pill.ok{background:var(--ok-soft); color:var(--ok);}
.pill.warn{background:var(--warn-soft); color:var(--warn);}
.pill.err{background:var(--err-soft); color:var(--err);}
.pill.pipeline{background:var(--pipeline-soft); color:var(--pipeline);}
.pill.dispatch{background:var(--dispatch-soft); color:var(--dispatch);}
.pill.cancel{background:var(--cancel-soft); color:var(--cancel); text-decoration:line-through; text-decoration-thickness:1.5px;}
.pill.hold{background:var(--hold-soft); color:var(--hold);}
.pill.pink{background:var(--pink-soft); color:var(--pink);}
button{font-family:inherit; cursor:pointer;}
.btn{
  border:1px solid var(--line); background:#fff; color:var(--ink); padding:7px 12px; border-radius:4px;
  font-size:12px; font-weight:600;
}
.btn:hover{border-color:#b9c2c1;}
.btn.primary{background:var(--steel); color:#fff; border-color:var(--steel);}
.btn.primary:hover{background:#0f171c;}
select, input[type=text], input[type=number]{
  font-family:'IBM Plex Mono',monospace; font-size:12.5px; border:1px solid var(--line); border-radius:4px;
  padding:6px 8px; background:#fff; color:var(--ink);
}
select:focus, input:focus{outline:2px solid #cdd9da; outline-offset:0;}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{
  text-align:left; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft);
  padding:9px 12px; border-bottom:1px solid var(--line); background:#f7f9f8; font-weight:700;
}
/* Progress Report: freeze the column headers while the row list scrolls
   inside its own panel (see the max-height/overflow on that panel-body). */
#prog-table thead th{position:sticky; top:0; z-index:5; box-shadow:0 1px 0 var(--line);}
/* Progress Report: conditional-format the whole row by order status. */
#prog-table tbody tr.row-completed{background:var(--ok-soft);}
#prog-table tbody tr.row-cancelled{background:var(--err-soft);}
#prog-table tbody tr.row-in-production{background:var(--warn-soft);}
#prog-table tbody tr.row-on-hold{background:var(--hold-soft-light);}
#prog-table tbody tr.row-pipeline{background:var(--pipeline-soft);}
#prog-table tbody tr.row-for-dispatch{background:var(--dispatch-soft);}
#prog-table tbody tr.row-in-inventory{background:var(--pink-soft);}
#prog-table tbody tr.row-completed:hover{background:#c9e6d7;}
#prog-table tbody tr.row-cancelled:hover{background:#f0c7c0;}
#prog-table tbody tr.row-in-production:hover{background:#f0dda3;}
#prog-table tbody tr.row-pipeline:hover{background:#c7d8f5;}
#prog-table tbody tr.row-for-dispatch:hover{background:#dccbfb;}
#prog-table tbody tr.row-on-hold:hover{background:var(--hold-soft);}
#prog-table tbody tr.row-in-inventory:hover{background:#f6c2df;}
#prog-table tbody tr.prog-row{cursor:pointer;}
#prog-table tbody tr.prog-row input, #prog-table tbody tr.prog-row select, #prog-table tbody tr.prog-row button{cursor:auto;}
#prog-table tbody tr.prog-row.inv-row-open td{box-shadow:inset 0 -2px 0 var(--hold);}
tr.prog-detail-row td{padding:0; border-bottom:1px solid #eef1f0;}
#prog-table tbody tr[class*="row-"] td{background:transparent;}
#prog-table tbody tr[class*="row-"] select,
#prog-table tbody tr[class*="row-"] input{background:transparent;}
td{padding:10px 12px; border-bottom:1px solid #eef1f0; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafbfb;}

/* ---------- dashboard ---------- */
.stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
.stat-card{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:16px 18px;}
.stat-card .num{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:34px; line-height:1;}
.stat-card .lbl{margin-top:5px; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em;}
.stat-card.err .num{color:var(--err);}
.stat-card.warn .num{color:var(--warn);}
.stat-card.accent .num{color:var(--accent);}
.two-col{display:grid; grid-template-columns:1.1fr .9fr; gap:16px; margin-bottom:16px;}
.bar-row{display:flex; align-items:center; gap:10px; padding:8px 0;}
.bar-row .m-name{width:118px; font-size:12px; font-weight:600; flex-shrink:0;}
.bar-track{flex:1; background:#eef1f0; height:16px; border-radius:3px; overflow:hidden;}
.bar-fill{height:100%; background:linear-gradient(90deg,#c1440e,#e0703a);}
.bar-row .m-hrs{width:56px; text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); flex-shrink:0;}
.err-row{display:flex; gap:10px; padding:9px 0; border-bottom:1px solid #f0f2f1; align-items:flex-start;}
.err-row:last-child{border-bottom:none;}
.err-sev{width:7px; height:7px; border-radius:50%; margin-top:5px; flex-shrink:0;}
.err-sev.high{background:var(--err);} .err-sev.medium{background:var(--warn);} .err-sev.low{background:#9aa8ac;}
.err-body{flex:1;}
.err-body .m{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
.err-body .d{font-size:13px; margin-top:1px;}
.err-time{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); flex-shrink:0;}
.err-form{display:flex; gap:6px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); flex-wrap:wrap;}
.err-form select, .err-form input{flex:1; min-width:100px;}

/* ---------- map ---------- */
#map-wrap{display:grid; grid-template-columns:250px 1fr; gap:16px; align-items:start;}
.queue-col{
  display:flex; flex-direction:column; gap:16px;
  position:sticky; top:88px; align-self:start;
  max-height:calc(100vh - 108px); overflow-y:auto; overflow-x:hidden;
  padding-right:2px;
}
#queue-panel .panel-body{padding:12px;}
#queue-panel.drag-over, #worker-queue-panel.drag-over, #inventory-panel.drag-over, #dispatch-panel.drag-over{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
#dispatch-panel .panel-body{padding:12px;}
.chip.worker-chip{border-left-color:#2f8fd1;}
.chip.chip-onhold{background:var(--hold-soft-light); border-left-color:var(--hold);}
.chip.chip-onhold:hover{background:var(--hold-soft);}
.onhold-tag{color:var(--hold); font-weight:700;}
.chip.chip-ininventory{background:var(--pink-soft); border-left-color:var(--pink);}
.chip.chip-ininventory:hover{background:#f6c2df;}
.inv-tag{color:var(--pink); font-weight:700;}
.chip.chip-dispatchready{background:var(--dispatch-soft); border-left-color:var(--dispatch); cursor:default;}
.disp-tag{color:var(--dispatch); font-weight:700;}
.dispatch-ready-list{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
.chip{
  background:#fff; border:1px solid var(--line); border-left:4px solid var(--ink-soft);
  border-radius:4px; padding:8px 10px; margin-bottom:8px; cursor:grab; transition:box-shadow .12s, transform .12s;
}
.chip:active{cursor:grabbing;}
.chip:hover{box-shadow:0 2px 8px rgba(0,0,0,.08);}
.chip .so{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent); font-weight:600;}
.chip .item{font-size:12px; font-weight:600; margin-top:2px; line-height:1.3;}
.chip .meta{font-size:11px; color:var(--ink-soft); margin-top:3px;}
.empty-hint{font-size:12px; color:var(--ink-soft); text-align:center; padding:20px 8px; border:1px dashed var(--line); border-radius:6px;}

#factory{
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/24px 24px,
    #f8faf9;
  border:1px solid var(--line); border-radius:6px; padding:26px; min-height:560px; position:relative;
}
.factory-title{
  position:absolute; top:14px; left:20px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:#9aa8ac; font-weight:700;
}
.factory-grid{display:grid; grid-template-columns:1fr 1fr; gap:34px; margin-top:26px; position:relative;}
.col-left, .col-right{display:flex; flex-direction:column; gap:10px;}
.divider{border-left:1.5px dashed #b9c6c4; position:absolute; left:50%; top:6px; bottom:6px;}
.col-flow-label{
  display:flex; align-items:center; gap:6px; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
  color:#8fa0a7; font-weight:700; margin-bottom:4px; padding-bottom:8px; border-bottom:1px dashed #d6dedc;
}
.col-flow-label svg{width:14px; height:14px; flex-shrink:0;}
.zone-group{display:flex; flex-direction:column; gap:8px; padding:8px; border:1px dashed #d6dedc; border-radius:6px; background:#fdfefe;}
.zone-label{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#8fa0a7; font-weight:700; margin-bottom:2px;}

.machine{
  background:#fff; border:2px dashed #c3ccca; border-radius:5px; padding:10px 12px; min-height:64px;
  transition:border-color .15s, background .15s;
}
.machine.drag-over{border-color:var(--accent); background:var(--accent-soft);}
.machine.dispatch-tile{border-color:var(--dispatch); background:var(--dispatch-soft);}
.machine.dispatch-tile.drag-over{border-color:var(--dispatch); background:#dccbfb;}
.machine.dispatch-tile .machine-name{color:var(--dispatch);}
.machine.active{border-style:solid; border-color:var(--accent);}
.machine.has-error{border-color:var(--err); box-shadow:0 0 0 3px var(--err-soft);}
.machine.staffed{background:var(--bg);}
.machine.stacked{background:var(--accent-soft);}
.machine.needs-worker{border-color:var(--warn); box-shadow:0 0 0 3px var(--warn-soft);}
.stack-count{
  float:right; background:var(--accent); color:#fff; font-size:9.5px; font-weight:700;
  letter-spacing:.02em; padding:2px 6px; border-radius:9px; text-transform:none;
}
.needs-worker-badge{
  float:right; background:var(--warn); color:#fff; font-size:9.5px; font-weight:700;
  letter-spacing:.02em; padding:2px 6px; border-radius:9px; text-transform:none;
}
.mp-alert-panel{
  margin:10px 18px 0 18px; border:1px solid var(--warn); background:var(--warn-soft); border-radius:6px;
  padding:12px 16px;
}
.mp-alert-panel .mp-alert-title{
  font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--warn);
  margin-bottom:6px;
}
.mp-alert-panel ul{margin:0; padding-left:18px; font-size:12px; color:var(--ink);}
.mp-alert-panel li{margin-bottom:2px;}
.mp-alert-panel.mp-alert-clear{border-color:var(--ok); background:var(--ok-soft);}
.mp-alert-panel.mp-alert-clear .mp-alert-title{color:var(--ok);}
.machine-worker{margin-top:6px; background:rgba(255,255,255,.6); border-radius:4px; padding:5px 24px 5px 8px; position:relative; cursor:grab;}
.machine-worker.dragging{opacity:.45;}
.machine-worker .worker-name{font-size:11px; font-weight:700; color:var(--steel);}
.machine-worker .worker-meta{display:block; font-size:10px; color:var(--ink-soft); margin-top:1px;}
.worker-unassign{
  position:absolute; top:4px; right:4px; width:16px; height:16px; line-height:14px; padding:0;
  border:none; border-radius:3px; background:transparent; color:var(--ink-soft); font-size:11px; cursor:pointer;
}
.worker-unassign:hover{background:var(--err-soft); color:var(--err);}
.machine-name{font-size:11.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--ink);}
.machine-job{margin-top:7px; background:var(--accent-soft); border-radius:4px; padding:7px 9px; cursor:grab;}
.machine-job.dragging{opacity:.45;}
.chip.dragging{opacity:.45;}
.machine-job .so{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--accent); font-weight:700;}
.machine-job .item{font-size:11.5px; font-weight:600; margin:2px 0;}
.machine-job .customer{font-size:10.5px; color:var(--ink-soft); font-weight:600; margin-bottom:2px;}
.machine-job .acts, .chip-dispatchready .acts{display:flex; gap:6px; margin-top:5px;}
.machine-job .acts button, .chip-dispatchready .acts button{
  border:none; border-radius:3px; font-size:10px; font-weight:700; padding:3px 7px; letter-spacing:.03em;
}
.act-complete{background:var(--ok); color:#fff;}
.act-unassign{background:#e7e0da; color:#6b5a49;}
.act-delete{background:var(--err-soft); color:var(--err);}
.machine-idle{margin-top:6px; font-size:11px; color:#9aa8ac; font-style:italic;}

/* ---------- inventory ---------- */
.inv-toolbar{display:flex; gap:10px; margin-bottom:14px; align-items:center;}
.inv-toolbar input[type=text]{width:260px;}
input.stock-input{width:66px; text-align:right;}
.status-badge{font-family:'Barlow Condensed',sans-serif; font-weight:700; letter-spacing:.03em;}

.inv-table .inv-expand-cell{color:var(--ink-soft); font-size:11px; text-align:center; user-select:none;}
.inv-table tr.inv-row{cursor:pointer;}
.inv-table tr.inv-row input, .inv-table tr.inv-row button{cursor:auto;}
.inv-table tr.inv-row:hover{background:#fafbfb;}
.inv-table tr.inv-row-open{background:#f7f9fa;}
.inv-product-input{font-weight:600; font-size:13px; width:220px;}
.inv-category-input{width:150px;}
.inv-product-sub{font-size:11px; color:var(--ink-soft); margin-top:3px;}
tr.inv-detail-row td{padding:0; border-bottom:1px solid #eef1f0;}
.inv-detail-panel{background:#f7f9fa; padding:16px 22px 20px 22px; border-top:1px solid var(--line);}
.inv-detail-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:14px;}
.inv-detail-title{font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:19px; letter-spacing:.01em; color:var(--ink);}
.inv-detail-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.inv-detail-qty-group{display:flex; gap:22px;}
.inv-detail-qty-item{text-align:right; padding-left:22px; border-left:1px solid var(--line);}
.inv-detail-qty-item:first-child{padding-left:0; border-left:none;}
.inv-detail-qty-num{font-size:22px; font-weight:700; color:var(--ink); line-height:1;}
.inv-detail-qty-label{font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; margin-top:2px;}
.inv-detail-history-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); margin-bottom:6px;}
.inv-movement-table{background:var(--panel); border:1px solid var(--line); border-radius:6px; overflow:hidden;}
.inv-movement-table th{font-size:10.5px;}
.inv-movement-table td{padding:8px 12px; font-size:12.5px;}
.inv-movement-table tbody tr:last-child td{border-bottom:none;}

.status-select{font-family:'IBM Plex Mono',monospace;}

/* ---------- progress report toolbar ---------- */
.head-actions{display:flex; gap:8px; position:relative;}
.export-wrap{position:relative;}
.export-menu{
  position:absolute; top:calc(100% + 6px); right:0; background:#fff; border:1px solid var(--line);
  border-radius:6px; box-shadow:0 6px 20px rgba(0,0,0,.12); min-width:170px; z-index:30; overflow:hidden;
  display:none;
}
.export-menu.open{display:block;}
.export-menu button{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:9px 12px; border:none;
  background:#fff; font-size:12.5px; font-weight:600; color:var(--ink);
}
.export-menu button:hover{background:#f4f6f5;}
.export-menu button + button{border-top:1px solid #eef1f0;}

td input.cell-text{width:100%; border:1px solid transparent; background:transparent; font-family:inherit; font-size:12.5px; padding:4px 6px; border-radius:3px;}
td input.cell-text:hover, td input.cell-text:focus{border-color:var(--line); background:#fff;}
td input.cell-qty{width:60px;}
.row-del{border:none; background:var(--err-soft); color:var(--err); width:24px; height:24px; border-radius:4px; font-size:13px; font-weight:700; line-height:1;}
.row-del:hover{background:var(--err); color:#fff;}

/* ---------- iOS / touch: tap-to-place fallback for drag & drop ----------
   iOS Safari never fires HTML5 drag/drop events on touch, so cards on the
   Map view are also selectable/placeable by tap (see wireMapDragAndTap in
   the script). These classes are the visual feedback for that flow. */
.tap-selected{outline:2px solid var(--accent); outline-offset:1px; box-shadow:0 2px 10px rgba(193,68,14,.35);}
.tap-target{outline:2px dashed var(--accent); outline-offset:2px;}
.tap-hint{display:none; font-size:11px; color:var(--ink-soft); text-align:center; padding:8px 4px 0 4px;}
@media (hover:none) and (pointer:coarse){
  .tap-hint{display:block;}
  /* HTML5 drag handles (grab cursor) don't mean anything on touch */
  .chip, .machine-worker, .machine-job{cursor:pointer;}
}

/* ---------- iOS-safe form controls ----------
   iOS Safari auto-zooms the page when a focused input's font-size is under
   16px. Bumping to 16px on touch devices stops that jump without changing
   the (smaller) desktop mouse sizing. */
@media (hover:none) and (pointer:coarse){
  select, input[type=text], input[type=number], input[type=date], input[type=time], td input.cell-text{
    font-size:16px;
  }
}
button, .btn, .nav-item, .chip, .machine-job, .machine-worker, .worker-unassign, .row-del{
  touch-action:manipulation; /* kills the ~300ms tap delay / double-tap-zoom on buttons */
}

/* ---------- mobile / narrow-screen layout ----------
   Below this width the fixed 216px sidebar would eat most of a phone
   screen, so it becomes an off-canvas drawer toggled by a hamburger
   button that only exists at this size (see #menu-toggle). ---- */
#menu-toggle{display:none;}
#sidebar-backdrop{display:none;}
@media (max-width:880px){
  html,body{overflow-x:hidden;}
  #menu-toggle{
    display:flex; align-items:center; justify-content:center; width:38px; height:38px;
    border:1px solid var(--line); background:#fff; border-radius:6px; margin-right:10px; flex-shrink:0;
  }
  #menu-toggle svg{width:18px; height:18px;}
  #topbar{padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top, 0px)); gap:10px;}
  #topbar h1{font-size:20px;}
  #content{padding:16px 14px 40px 14px; padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px));}
  #sidebar{
    left:0; transform:translateX(-100%); transition:transform .2s ease; z-index:100; width:230px;
    box-shadow:0 0 0 2000px rgba(0,0,0,0); -webkit-overflow-scrolling:touch; overflow-y:auto;
    padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  body.sidebar-open #sidebar{transform:translateX(0); box-shadow:4px 0 24px rgba(0,0,0,.25);}
  body.sidebar-open #sidebar-backdrop{
    display:block; position:fixed; inset:0; background:rgba(10,15,18,.45); z-index:90;
  }
  #main{margin-left:0 !important;}
  .stat-row{grid-template-columns:repeat(2,1fr);}
  .two-col{grid-template-columns:1fr;}
  #map-wrap{grid-template-columns:1fr;}
  .factory-grid{grid-template-columns:1fr; gap:20px;}
  .divider{display:none;}
  .queue-col{
    flex-direction:row; overflow-x:auto; overflow-y:visible; -webkit-overflow-scrolling:touch; gap:10px;
    position:static; max-height:none;
  }
  .queue-col .panel{min-width:240px; flex-shrink:0;}
  /* tables: let them scroll horizontally inside their panel instead of
     squashing every column unreadably small */
  .panel-body{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .panel-body table{min-width:640px;}
  .worker-unassign{width:22px; height:22px; line-height:20px; font-size:13px;}
  .row-del{width:30px; height:30px;}
  .inv-toolbar{flex-wrap:wrap;}
  .inv-toolbar input[type=text]{width:100%;}
}

@media print{
  #sidebar, #topbar, .inv-toolbar, .head-actions, .row-del, #inv-add, #import-csv-btn, #import-csv-input, #import-inv-csv-btn, #import-inv-csv-input, #import-mp-csv-btn, #import-mp-csv-input, #import-err-csv-btn, #import-err-csv-input, #import-log-csv-btn, #import-log-csv-input, #import-disp-csv-btn, #import-disp-csv-input, #import-recv-csv-btn, #import-recv-csv-input{display:none !important;}
  #main{margin-left:0 !important;}
  body{background:#fff !important;}
  #content{padding:0 !important;}
  .panel{border:none !important;}
  table input, table select{border:none !important; background:transparent !important; -webkit-appearance:none; appearance:none;}
  /* Without this, Chrome/Safari strip every element's background-color and
     background-image by default when printing (to save ink), which is why
     the Map's colored machine tiles (e.g. the blue "staffed" background
     that shows a machine has workers assigned), status pills, chips, and
     row highlighting were all coming out plain white on a printed page even
     though the ordinary color scheme uses them everywhere on screen. Forcing
     exact color reproduction on every element makes the printed page match
     what's actually on screen. */
  *{
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
    color-adjust:exact !important;
  }
  #map-wrap, #factory, .machine, .machine.staffed, .chip, .machine-job, .machine-worker, .pill, .queue-col{
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
  }
}
</style>

const $ = sel => document.querySelector(sel);

/* Escape a value for safe use inside an HTML attribute, e.g. value="${escAttr(x)}".
   SKUs/items routinely contain " (inch marks), which would otherwise close the
   attribute early and truncate everything after it. */
function escAttr(s){
  return String(s==null? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}
/* Escape a value for safe use as HTML text content. */
function escHtml(s){
  return String(s==null? '' : s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}
const machineById = id => state.machines.find(m=>m.id===id);
const orderById = id => state.orders.find(o=>o.id===id);

function estHours(order){ return Math.max(0.5, Math.round(remainingQty(order)*0.12*10)/10); }

function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ---- Plan Number series: PLN<YY>-<00000>, e.g. PLN26-00001.
       The numeric tail keeps counting up from whatever the highest existing
       number is, regardless of which year prefix it was stamped with — so
       "the last number of the format" always continues correctly, whether
       a plan number was typed in, added via + Add, or brought in by CSV import. ---- */
const PLAN_NUMBER_RE = /^PLN\d{2}-(\d{5,})$/i;
function planNumberSeriesMax(){
  let max = 0;
  state.orders.forEach(o=>{
    const m = PLAN_NUMBER_RE.exec(String(o.planNumber||'').trim());
    if(m){ const n = parseInt(m[1],10); if(!isNaN(n) && n>max) max = n; }
  });
  return max;
}
function formatPlanNumber(n){
  return `PLN${String(new Date().getFullYear()%100).padStart(2,'0')}-${String(n).padStart(5,'0')}`;
}
function nextPlanNumber(){ return formatPlanNumber(planNumberSeriesMax()+1); }

/* ---- Normalizes a date cell coming from a CSV/Excel import into the
       YYYY-MM-DD format the <input type="date"> fields require. Without
       this, Excel's default "8/5/2026" style (or a raw date serial number)
       gets stored as-is and the date input silently fails to render it. ---- */
function parseDateToISO(raw){
  const v = String(raw==null?'':raw).trim();
  if(!v) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v; // already ISO
  if(/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(v)){ // YYYY/M/D
    const [y,mo,d] = v.split('/');
    return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }
  let m = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/.exec(v); // M/D/YYYY or M-D-YYYY
  if(m){
    let a = parseInt(m[1],10), b = parseInt(m[2],10), y = m[3];
    let month = a, day = b;
    if(a>12 && b<=12){ month = b; day = a; } // e.g. 25/12/2026 -> swap to Dec 25
    return `${y}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
  }
  if(/^\d+(\.\d+)?$/.test(v)){ // Excel date serial number
    const serial = Number(v);
    const excelEpoch = Date.UTC(1899,11,30);
    const d = new Date(excelEpoch + serial*86400000);
    if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  }
  const parsed = new Date(v); // last resort — e.g. "Aug 5, 2026"
  if(!isNaN(parsed.getTime())) return parsed.toISOString().slice(0,10);
  return v; // couldn't recognize it — keep the original text rather than losing it silently
}

/* ---- Multi-machine splits ----
   An order used to live on exactly one machine at a time (o.machineId).
   Now an order's Plan Qty can be spread across several machines running
   at once — e.g. 200 pcs on Machine 8, 150 on Machine 3, 68 on Machine 5 —
   tracked as o.splits: [{id, machineId, qty}]. Each split represents a
   qty currently being run on that machine and hasn't been marked
   Complete yet. o.machineId is still used, unchanged, for the single
   "For Dispatch" shortcut tile (see dispatchMachine()), which isn't a
   real production split. */
function productionQty(o){ return (o.splits||[]).reduce((s,sp)=> s + (Number(sp.qty)||0), 0); }
/* Remaining Qty = PL Qty minus Actual Qty. This is NOT reduced by qty
   currently running as splits (productionQty) — a split hasn't been
   marked Complete yet, so it isn't Actual Qty, and Remaining Qty should
   reflect what's truly left to still be produced/accounted for against
   the plan, regardless of whether some of it happens to be mid-run on a
   machine right now. */
function remainingQty(o){ return (Number(o.plQty)||0) - (Number(o.actualQty)||0); }
/* Unscheduled Qty = Remaining Qty minus whatever's already running as
   splits on other machines. Used specifically for "how much of this
   order still needs to be assigned to a machine" — i.e. the Order Queue
   list and the cap when creating a new split — which is a different
   question from the plan-vs-actual Remaining Qty above. */
function unscheduledQty(o){ return remainingQty(o) - productionQty(o); }
/* Total quantity of this order sitting in the Dispatch menu right now — every
   linked Dispatch row (see completeSplit/createDispatchFromOrder/
   sendInventoryToDispatch, all of which stamp orderId onto the Dispatch row
   they create), regardless of that row's own status. Counting all statuses
   (not just Completed) means the moment qty is sent to Dispatch it stops
   reading as "In Inventory" — it doesn't wait for the shipment to actually
   go out. The physical SKU-level stock ledger (state.inventory[].stock) is a
   separate thing and still only moves when a row is actually marked Complete
   (see syncDispatchInventory/dispatchRow) — this function is purely the
   per-order "how much is queued up in Dispatch" figure. Shown as its own
   "Dispatch Qty" column next to Actual Qty. */
function dispatchQty(o){
  return state.dispatches.filter(d=>d.orderId===o.id).reduce((s,d)=> s + (Number(d.qty)||0), 0);
}
/* Actual Qty and Dispatch Qty alone don't tell you whether a job is
   physically sitting in finished-goods stock right now — Actual Qty is
   everything produced so far, and Dispatch Qty is everything already queued
   up in the Dispatch menu (any status, see dispatchQty above). This is the
   piece still physically on the shelf: produced minus whatever has actually
   shipped out. Only Completed dispatch rows count against it — a row sitting
   at Not Started or Ready for Dispatch (pending) hasn't left the warehouse
   yet, so it doesn't reduce this figure (this mirrors the physical stock
   ledger's completed-only rule, see syncDispatchInventory). Shown as its own
   "In Inventory" column. */
function inventoryQty(o){
  const shipped = state.dispatches
    .filter(d=>d.orderId===o.id && d.status==='completed')
    .reduce((s,d)=> s + (Number(d.qty)||0), 0);
  return Math.max(0, (Number(o.actualQty)||0) - shipped);
}
/* Finds the split currently running on a given (non-dispatch) machine,
   across every order. Returns {order, split} or null. Kept around for any
   caller that only cares whether a machine has at least one job on it. */
function splitOnMachine(machineId){
  for(const o of state.orders){
    const sp = (o.splits||[]).find(s=> s.machineId===machineId);
    if(sp) return {order:o, split:sp};
  }
  return null;
}
/* Finds every split currently running on a given (non-dispatch) machine,
   across every order — a machine can now have more than one job stacked
   on it at once (e.g. two different PL numbers for the same item), so
   this returns an array of {order, split} rather than a single match. */
function splitsOnMachine(machineId){
  const out = [];
  for(const o of state.orders){
    (o.splits||[]).forEach(sp=>{ if(sp.machineId===machineId) out.push({order:o, split:sp}); });
  }
  return out;
}
function splitById(orderId, splitId){
  const o = orderById(orderId);
  if(!o) return null;
  const sp = (o.splits||[]).find(s=>s.id===splitId);
  return sp ? {order:o, split:sp} : null;
}
/* Sends a qty of an order onto a machine as a new split. Prompts for how
   many pieces (defaulting to everything still unscheduled) so one order
   can be worked on several machines at the same time. */
function createSplit(orderId, machineId){
  const o = orderById(orderId);
  if(!o) return;
  // Machines can carry more than one job at once (stacked) — e.g. the same
  // item under two different PL numbers both running on the same machine —
  // so no "machine already occupied" check here.
  const rem = unscheduledQty(o);
  if(rem<=0){ alert('This order has no unscheduled quantity left to assign.'); return; }
  const raw = prompt(`How many pieces of "${o.item}" go to ${machineName(machineId)}?\n(${rem} pcs unscheduled)`, String(rem));
  if(raw===null) return; // cancelled
  const qty = Math.floor(Number(raw));
  if(!qty || qty<=0 || qty>rem){ alert(`Enter a whole number between 1 and ${rem}.`); return; }
  o.splits = o.splits || [];
  o.splits.push({id:'sp'+Date.now()+Math.random().toString(36).slice(2,7), machineId, qty});
  if(o.status==='not-started' || o.status==='pipeline' || o.status==='on-hold') o.status='in-production';
  recordOrderMovement(o, o.status, null);
  render();
}
/* Reassigns an existing (not-yet-completed) split to a different machine —
   same qty, no prompt needed. */
function moveSplit(orderId, splitId, machineId){
  const found = splitById(orderId, splitId);
  if(!found) return;
  if(found.split.machineId===machineId) return;
  // Stacking is allowed — a machine can hold more than one job at a time —
  // so this just moves the split, no occupied-machine check.
  found.split.machineId = machineId;
  render();
}
/* Sends a split back to the Order Queue unproduced — its qty becomes
   unscheduled again (unscheduledQty goes back up), nothing is credited to
   Actual Qty or Inventory. */
function unassignSplit(orderId, splitId){
  const o = orderById(orderId);
  if(!o) return;
  o.splits = (o.splits||[]).filter(s=>s.id!==splitId);
  if(!o.splits.length && !(Number(o.actualQty)>0) && o.status==='in-production') o.status='pipeline';
  render();
}
/* Marking a split's portion Complete: credits its qty straight to Actual
   Qty and to Inventory stock for that SKU, and removes it from Production
   Qty (by removing the split). Normally this ONLY touches Inventory — it
   does not auto-open a Dispatch-menu row; a row only gets created once the
   goods are explicitly handed off to Dispatch (see assignOrder /
   setOrderStatus's 'for-dispatch' path, or sendInventoryToDispatch).
   BUT if this split was completed by dropping it straight onto the For
   Dispatch tile (toDispatch=true, see placeOrderOnMachine), that drop IS
   the explicit hand-off — so this also opens a "Ready for Dispatch" row for
   the qty right here, instead of the qty silently landing in Inventory with
   no sign it was ever dropped on Dispatch at all. */
function completeSplit(orderId, splitId, toDispatch){
  const o = orderById(orderId);
  if(!o) return;
  const split = (o.splits||[]).find(s=>s.id===splitId);
  if(!split) return;
  const qty = Number(split.qty)||0;
  o.splits = o.splits.filter(s=>s.id!==splitId);
  o.actualQty = (Number(o.actualQty)||0) + qty;

  const inv = findInventoryBySku(o.item);
  if(inv) inv.stock = (Number(inv.stock)||0) + qty;

  if(!o.splits.length && remainingQty(o)<=0){
    // The full plan qty has now been produced. If this split was completed
    // by dropping it straight onto the For Dispatch tile, treat it exactly
    // like a whole order landing there (see assignOrder) — status
    // 'for-dispatch' and machineId pointed at the dispatch tile — so it
    // shows up stacked inside that tile the same way any other machine
    // shows its jobs, instead of only being findable in the side list.
    // Otherwise it lands on "In Inventory" as before. Either way the
    // completed portion is credited to Inventory immediately (see
    // renderMap's invReady, which shows any order with Ready Qty on hand
    // regardless of overall status), so a partial completion is visible
    // there too instead of disappearing until the very last split finishes.
    if(toDispatch){
      o.status = 'for-dispatch';
      o.machineId = dispatchMachine().id;
    }else{
      o.status = 'in-inventory';
    }
  }else if(!o.splits.length){
    // This split just finished but the order still has qty left against the
    // plan, and none of it has been dragged back onto a machine yet — there's
    // nothing actively in production right now, so rather than silently
    // sitting at whatever status it happened to have, flag it On Hold so
    // it's obviously waiting on a scheduling decision rather than quietly
    // stalled.
    o.status = 'on-hold';
  }
  if(toDispatch && qty>0){
    state.dispatches.unshift({
      id:'d'+Date.now()+Math.random().toString(36).slice(2,7), orderId:o.id, date:todayISO(),
      producedDate: todayISO(), so:o.so, customer:o.customer, sku:o.item, qty, status:'pending',
      notes:'Auto-added from Production Plan', inventoryQtyDeducted:0
    });
    if(!Array.isArray(o.history)) o.history = [];
    o.history.push({date: todayISO(), ts: Date.now(), text: `${qty} pcs sent to Dispatch`});
  }
  render();
  if(!inv) noInventoryMatchWarning(o.item);
}
function isPastDue(o){
  if(!o.dueDate || o.status==='completed') return false;
  return o.dueDate < todayISO();
}
function pastDueBadge(o){
  if(!o.dueDate) return '<span class="pill gray">—</span>';
  if(o.status==='completed') return '<span class="pill ok">On Time</span>';
  return isPastDue(o) ? '<span class="pill err">PAST DUE</span>' : '<span class="pill gray">On Track</span>';
}
const STATUS_LABELS = {'not-started':'Not Started','on-hold':'On Hold','pipeline':'Pipeline','in-production':'In Production','in-inventory':'In Inventory','for-dispatch':'For Dispatch','completed':'Completed','cancelled':'Cancelled'};
/* Dispatch rows use their own three-state status set (distinct from the
   Order status set above): 'not-started' for a dispatch row typed in
   manually that hasn't been produced yet, 'pending' for a row that's ready
   to ship (auto-added the moment production of that qty finishes), and
   'completed' once it's actually shipped out (which is what deducts the
   qty from Inventory stock). The internal value stays 'pending' for
   backward compatibility with existing saved data — only the label shown
   to the user is "Ready for Dispatch". */
const DISPATCH_STATUS_LABELS = {'not-started':'Not Started', 'pending':'Ready for Dispatch', 'completed':'Complete'};
function dispatchStatusLabel(s){ return DISPATCH_STATUS_LABELS[s] || s; }
const SEV_LABELS = {high:'High', medium:'Medium', low:'Low'};
const sevLabel = s => SEV_LABELS[s] || s;
function statusFromLabel(label){
  const l = String(label||'').trim().toLowerCase();
  const hit = Object.entries(STATUS_LABELS).find(([k,v])=> v.toLowerCase()===l || k===l);
  return hit ? hit[0] : 'not-started';
}

function statusPill(status){
  const map = {
    'not-started':['gray','Not Started'],
    'pipeline':['pipeline','Pipeline'],
    'in-production':['warn','In Production'],
    'in-inventory':['pink','In Inventory'],
    'for-dispatch':['dispatch','For Dispatch'],
    'completed':['ok','Completed'],
    'on-hold':['hold','On Hold'],
    'cancelled':['err','Cancelled'],
  };
  const [cls,label] = map[status] || ['gray', status];
  return `<span class="pill ${cls}">${label}</span>`;
}

function findInventoryBySku(sku){
  const key = String(sku||'').trim().toLowerCase();
  if(!key) return null;
  return state.inventory.find(i=> i.sku.trim().toLowerCase()===key) || null;
}

/* Keeps an order's contribution to Inventory stock in sync with its status/actualQty.
   Adds the produced qty to stock once an order is In Inventory, For Dispatch, OR
   Completed — all three mean the run is physically finished and sitting in
   finished-goods stock, so the goods should count as on-hand stock as soon as any
   of them is set, not just at final Completed. If it's later reopened, its actualQty
   is edited, or its Item/SKU is changed, the difference (or reversal) is applied so
   a SKU's stock never double-counts or goes stale. Moving between In Inventory,
   For Dispatch, and Completed is a no-op here (same qty either way) since that
   hand-off is driven by the Map/Dispatch flow, not by inventory.
   Returns the SKU string if it couldn't find a matching inventory row (so the caller
   can warn the user), otherwise null. */
function syncOrderInventory(o, oldItem){
  if(oldItem!==undefined && oldItem!==null && oldItem!==o.item && (o.inventoryQtyAdded||0)!==0){
    const oldInv = findInventoryBySku(oldItem);
    if(oldInv) oldInv.stock = (Number(oldInv.stock)||0) - o.inventoryQtyAdded;
    o.inventoryQtyAdded = 0;
  }
  const shouldHaveAdded = (o.status==='completed' || o.status==='for-dispatch' || o.status==='in-inventory') ? (Number(o.actualQty)||0) : 0;
  const already = Number(o.inventoryQtyAdded)||0;
  const delta = shouldHaveAdded - already;
  if(delta===0) return null;
  const inv = findInventoryBySku(o.item);
  if(!inv) return o.item;
  inv.stock = (Number(inv.stock)||0) + delta;
  o.inventoryQtyAdded = shouldHaveAdded;
  return null;
}
function noInventoryMatchWarning(sku){
  alert(`"${sku}" isn't in Inventory yet, so stock wasn't updated. Add that SKU in Inventory, then re-save the Actual Qty (or Status) to sync it.`);
}

/* Returns the machine tile flagged dispatch:true (see state.machines) — the
   "For Dispatch" tile is a shortcut, not a real work center, so several
   functions below need to special-case it. */
function dispatchMachine(){ return state.machines.find(m=>m.dispatch); }

/* Machines that currently have active work (a split running on them) but no
   worker logged against them in state.manpower — a staffing gap. Used to
   drive the warning banner on the Manpower view and the "No Worker" badge
   on the Map. The For Dispatch tile is a status shortcut, not a real work
   center, so it's excluded. */
function unstaffedActiveMachines(){
  return state.machines.filter(m=>{
    if(m.dispatch) return false;
    const hasJob = splitsOnMachine(m.id).length>0;
    if(!hasJob) return false;
    const hasWorker = state.manpower.some(p=>p.machineId===m.id);
    return !hasWorker;
  });
}

/* Assigning an order to a machine has one special case: the "For Dispatch"
   tile. Landing there (via Map drag/tap OR the Machine dropdown in the
   Progress Report — both call this same function) should leave the Machine
   column reading "For Dispatch" AND flip Status to For Dispatch, so the two
   stay in sync and the order shows up as Pending in the Dispatch menu (see
   createDispatchFromOrder). Any other machine is normal production floor
   work as before. */
function assignOrder(orderId, machineId){
  const o = orderById(orderId);
  if(!o) return;
  const m = machineById(machineId);
  const wasForDispatch = o.status==='for-dispatch';
  const oldStatus = o.status, oldMachineId = o.machineId;

  if(m && m.dispatch){
    o.machineId = machineId;
    o.status = 'for-dispatch';
    if(!(Number(o.actualQty)>0)) o.actualQty = Number(o.plQty)||0;
    const warn = syncOrderInventory(o);
    createDispatchFromOrder(o);
    markOrderDispatchesPending(o);
    recordOrderMovement(o, oldStatus, oldMachineId);
    render();
    if(warn) noInventoryMatchWarning(warn);
    return;
  }

  // Pulling an order OFF the For Dispatch tile — whether dropped onto a real
  // machine, tapped back to the queue, or via the ↩ Unassign/✕ button — always
  // sends it back to In Inventory rather than starting a new production run
  // on whatever machine it happened to land on. Production already finished;
  // there's nothing left to schedule, so the machine is cleared too.
  if(wasForDispatch){
    o.machineId = null;
    o.status = 'in-inventory';
    removeDispatchForOrder(o);
    const warn = syncOrderInventory(o);
    recordOrderMovement(o, oldStatus, oldMachineId);
    render();
    if(warn) noInventoryMatchWarning(warn);
    return;
  }
  // Placing (or replacing) a Pipeline/On Hold/Not Started order onto a real
  // machine puts it into active production.
  o.machineId = machineId;
  if(o.status==='not-started' || o.status==='pipeline' || o.status==='on-hold') o.status='in-production';
  recordOrderMovement(o, oldStatus, oldMachineId);
  render();
}
function unassignOrder(orderId){
  const o = orderById(orderId);
  if(!o) return;
  const wasForDispatch = o.status==='for-dispatch';
  const oldStatus = o.status, oldMachineId = o.machineId;
  o.machineId = null;
  if(wasForDispatch){
    // Taking an order back off the For Dispatch tile (✕/↩ Unassign button,
    // or dragging it back to the Order Queue) sends it to In Inventory —
    // production already finished, so it just goes back on the shelf.
    o.status = 'in-inventory';
    removeDispatchForOrder(o);
    const warn = syncOrderInventory(o);
    recordOrderMovement(o, oldStatus, oldMachineId);
    render();
    if(warn) noInventoryMatchWarning(warn);
    return;
  }
  // Sent back to the Pipeline queue rather than all the way to Not Started,
  // so it's still visible on the Map to be rescheduled.
  if(o.status==='in-production') o.status='pipeline';
  recordOrderMovement(o, oldStatus, oldMachineId);
  render();
}
/* Completing an order adds its Actual Qty straight to the finished item's
   Ready Stock (via syncOrderInventory). This ONLY touches Inventory — it no
   longer opens a Dispatch-menu row automatically; that only happens once the
   goods are explicitly handed off to Dispatch (see assignOrder /
   setOrderStatus's 'for-dispatch' path). If nobody ever typed a number into
   Actual Qty, it's still sitting at 0 — without this, completing the order
   would silently add 0 to stock instead of the quantity that was actually
   planned/run. So on completion, an unset (0 or blank) Actual Qty is assumed
   to mean "the full planned run was produced" and defaults to Planned Qty.
   Once Actual Qty is nonzero (whether from this default or the user's own
   entry), later edits still just reconcile the difference as before. */
function completeOrder(orderId){
  const o = orderById(orderId);
  if(!o) return;
  const wasForDispatch = o.status==='for-dispatch';
  const oldStatus = o.status, oldMachineId = o.machineId;
  o.machineId = null;
  // Finishing production lands on "In Inventory", not "Completed" — the
  // order only reaches Completed once its linked Dispatch row is actually
  // shipped (see syncOrderFromDispatch).
  o.status='in-inventory';
  if(!(Number(o.actualQty)>0)) o.actualQty = Number(o.plQty)||0;
  // If this was completed straight from the For Dispatch tile (rather than
  // by marking its Dispatch row Completed in the Dispatch menu), close out
  // that now-redundant Pending row too, so it doesn't sit there orphaned.
  // No replacement row is opened here anymore — completing only affects
  // Inventory now.
  if(wasForDispatch) removeDispatchForOrder(o);
  const warn = syncOrderInventory(o);
  recordOrderMovement(o, oldStatus, oldMachineId);
  render();
  if(warn) noInventoryMatchWarning(warn);
}
/* For Dispatch is the hand-off point from Production into Dispatch: setting an
   order to it opens a matching row in the Dispatch menu (Sales Order,
   Customer, SKU, and produced Qty carried over) so the warehouse sees exactly
   what's ready to ship, without re-keying it. orderId links the two records so
   this only ever happens once per order — the dedupe below fires regardless of
   which caller reaches it first (e.g. a per-split entry from completeSplit
   already covers the order, so a later full-order completion won't add a
   second one). Status defaults to 'pending' ("Ready for Dispatch") for the
   For Dispatch tile/status, since that explicitly means the whole run is
   ready to ship right now; callers that just finished production (Progress
   Report reaching Completed, by any path) pass 'not-started' instead, since
   that goods-in-hand-but-not-yet-queued-to-ship state still needs a manual
   nudge to "Ready for Dispatch" before the Dispatch button will act on it. */
function createDispatchFromOrder(o, status){
  if(state.dispatches.some(d=>d.orderId===o.id)) return;
  state.dispatches.unshift({
    id:'d'+Date.now(), orderId:o.id, date:todayISO(), producedDate:todayISO(), so:o.so, customer:o.customer, sku:o.item,
    qty:Number(o.actualQty)||Number(o.plQty)||0, status: status||'pending', notes:'Auto-added from Production Plan',
    inventoryQtyDeducted:0
  });
}
/* Once an order is moved onto the For Dispatch tile/status, any of its
   linked Dispatch rows still sitting at "Not Started" (opened automatically
   when a split/order finished production — see completeSplit/completeOrder)
   are flipped to "Ready for Dispatch" so the warehouse actually sees them as
   shippable, instead of needing a separate manual nudge per row. */
function markOrderDispatchesPending(o){
  state.dispatches.forEach(d=>{ if(d.orderId===o.id && d.status==='not-started') d.status='pending'; });
}
function removeDispatchForOrder(o){
  const stillPending = state.dispatches.filter(d=>d.orderId===o.id && d.status==='pending');
  if(!stillPending.length) return;
  stillPending.forEach(d=>{
    if((d.inventoryQtyDeducted||0)!==0){
      const inv = findInventoryBySku(d.sku);
      if(inv) inv.stock = (Number(inv.stock)||0) + d.inventoryQtyDeducted;
    }
  });
  const removeIds = new Set(stillPending.map(d=>d.id));
  state.dispatches = state.dispatches.filter(d=>!removeIds.has(d.id));
}
function setOrderStatus(orderId, status){
  const o = orderById(orderId);
  if(!o) return;
  const wasForDispatch = o.status==='for-dispatch';
  const oldStatus = o.status, oldMachineId = o.machineId;
  o.status = status;
  if(status==='for-dispatch'){
    // Keep Machine and Status in sync: setting Status to For Dispatch here
    // (rather than by dragging onto the tile) should still show "For
    // Dispatch" in the Machine column, not blank it out.
    const dm = dispatchMachine();
    o.machineId = dm ? dm.id : null;
  } else if(status!=='in-production'){
    o.machineId = null;
  }
  if((status==='completed' || status==='for-dispatch' || status==='in-inventory') && !(Number(o.actualQty)>0)) o.actualQty = Number(o.plQty)||0;
  const warn = syncOrderInventory(o);
  if(status==='for-dispatch'){
    createDispatchFromOrder(o);
    markOrderDispatchesPending(o);
  }
  else if(wasForDispatch) removeDispatchForOrder(o);
  // Setting Status to Completed/In Inventory directly no longer auto-opens a
  // Dispatch row either — same rule as completeSplit/completeOrder: only the
  // explicit 'for-dispatch' hand-off above creates one.
  recordOrderMovement(o, oldStatus, oldMachineId);
  render();
  if(warn) noInventoryMatchWarning(warn);
}
function setOrderMachineFromSelect(orderId, machineId){
  if(machineId===''){ unassignOrder(orderId); return; }
  const m = machineById(machineId);
  if(m && m.dispatch){ assignOrder(orderId, machineId); return; }
  const oCheck = orderById(orderId);
  if(oCheck && oCheck.status==='for-dispatch'){ unassignOrder(orderId); return; }
  const before = productionQty(orderById(orderId));
  createSplit(orderId, machineId);
  // createSplit prompts for a qty and may be cancelled/invalid — render()
  // in that case too, so the <select> (which the browser has already
  // updated visually) snaps back to reflect that nothing actually changed.
  if(productionQty(orderById(orderId))===before) render();
}

function machineName(id){ const m = machineById(id); return m? m.name : '— Unassigned —'; }
function statusLabel(s){ return STATUS_LABELS[s] || s; }

function addBlankOrder(){

    machineId:null, status:'not-started', inventoryQtyAdded:0, history:[], splits:[]
  });

}
function deleteOrder(orderId){
  const o = orderById(orderId);
  if(o && (o.inventoryQtyAdded||0)!==0){
    const inv = findInventoryBySku(o.item);
    if(inv) inv.stock = (Number(inv.stock)||0) - o.inventoryQtyAdded;
  }
  state.orders = state.orders.filter(o=>o.id!==orderId);
  render();
}
function setOrderField(orderId, field, value){
  const o = orderById(orderId);
  if(!o) return;
  const oldItem = field==='item' ? o.item : undefined;
  o[field] = (field==='plQty' || field==='actualQty' || field==='rawQty') ? Number(value) : value;
  // Auto-complete: once Actual Qty catches up to (or passes) PL Qty, the run
  // is done — flip the order to Completed and stamp End Date with today
  // rather than waiting for someone to do it by hand. Skipped for orders
  // that are already Completed/Cancelled, for a blank PL Qty of 0 (an order
  // that hasn't been planned yet shouldn't auto-close on a stray edit), and
  // for For Dispatch orders — those only move to Completed once their linked
  // Dispatch row actually ships (see syncOrderFromDispatch), not on a qty edit.
  // This no longer auto-opens a Dispatch row either — same rule as
  // completeSplit/completeOrder: it only reflects on Inventory/status.
  let autoCompleted = false;
  if(field==='actualQty' && o.status!=='completed' && o.status!=='cancelled' && o.status!=='for-dispatch' && (Number(o.plQty)||0)>0 && remainingQty(o)<=0){
    const oldStatus = o.status, oldMachineId = o.machineId;
    o.status = 'completed';
    o.machineId = null;
    o.endDate = todayISO();
    recordOrderMovement(o, oldStatus, oldMachineId);
    autoCompleted = true;
  }
  let warn = null;
  if(field==='actualQty' || field==='item'){
    warn = syncOrderInventory(o, oldItem);
  }
  if(autoCompleted){
    render(); // status/end-date changed elsewhere on the row (and possibly other panels), so a full re-render is needed rather than the narrow refreshOrderRow patch
  }else{
    refreshOrderRow(orderId);
    saveState();
  }
  if(warn) noInventoryMatchWarning(warn);
}
function refreshOrderRow(orderId){
  const o = orderById(orderId);
  if(!o) return;
  const remCell = document.querySelector(`[data-remaining="${orderId}"]`);
  if(remCell){
    const rem = remainingQty(o);
    remCell.textContent = rem;
    remCell.style.color = rem<0 ? 'var(--err)' : '';
    remCell.style.fontWeight = rem<0 ? '700' : '';
  }
  const pdCell = document.querySelector(`[data-pastdue="${orderId}"]`);
  if(pdCell) pdCell.innerHTML = pastDueBadge(o);
}

/* Machine name(s) for an order — a plain machineId for legacy/whole-order
   assignments (e.g. the For Dispatch tile), or a comma-separated list of
   every machine a split of this order is currently running on. */
function machinesLabel(o){
  if(o.splits && o.splits.length) return o.splits.map(s=>`${machineName(s.machineId)} (${s.qty})`).join(', ');
  return machineName(o.machineId);
}
function exportCSV(){
  const header = ['Machine','Status','Plan Number','Raw Material','Qty','Unit','Finished Goods','PL Qty','Production Qty','Actual Qty','Dispatch Qty','In Inventory','Remaining Qty','Sales Order','Customer','Due Date','Past Due','Order ID'];
  const rows = state.orders.map(o=>[
    machinesLabel(o), statusLabel(o.status), o.planNumber||'', o.rawMaterial||'', o.rawQty||0, o.unit||'', o.item,
    o.plQty, productionQty(o), o.actualQty||0, dispatchQty(o), inventoryQty(o), remainingQty(o), o.so, o.customer, o.dueDate||'',
    isPastDue(o) ? 'Yes' : 'No', o.id
  ]);
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = [header, ...rows].map(r=>r.map(esc).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'production-progress-report.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* ---- CSV import: the CSV is treated as the master file. Matching is Order ID
       first (exact, hidden column added by our own Export), then falls back to
       a normalized match on Plan Number + Finished Product + PL Qty + Sales
       Order for CSVs that don't have an Order ID (e.g. a spreadsheet built
       from scratch, or someone else's master file). "Normalized" means text
       fields are trimmed/lowercased/whitespace-collapsed before comparing, so
       stray spacing or capitalization differences between the CSV and what's
       already on file don't cause a real match to be missed (which is what
       was causing already-existing rows to come in as new duplicates).
       Regardless of whether the CSV has an Order ID column, ANY row currently
       in the system that isn't matched by some row in the CSV gets removed —
       the import always ends with the system being an exact copy of the CSV,
       and duplicate existing rows collapse to one because only the first
       match gets updated; the rest are left unmatched and get removed. ---- */
function normText(v){ return String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,' '); }
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i], next = text[i+1];
    if(inQuotes){
      if(c === '"' && next === '"'){ field += '"'; i++; }
      else if(c === '"'){ inQuotes = false; }
      else { field += c; }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\r'){ /* skip */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.length>1 || (r.length===1 && r[0]!==''));
}

/* Shared by every Import CSV button in the app: accepts .csv AND .xlsx
   (e.g. a filled-in copy of a Download Template file with dropdown data
   validation) and normalizes either into the same array-of-rows shape
   before handing it to that tab's own matching/add/update/remove logic —
   so the file-format handling only has to be written once, and every
   Import button behaves the same way (see MASTER-COPY IMPORT RULE below). */
function readImportFile(file, onRows){
  const isExcel = /\.xlsx?$/i.test(file.name);
  const reader = new FileReader();
  reader.onload = (e) => {
    try{
      let rows;
      if(isExcel){
        if(typeof XLSX==='undefined') throw new Error('xlsx-reader-unavailable');
        const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
        const ws = wb.Sheets[wb.SheetNames[0]];
        rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false, defval:''})
          .map(r=>r.map(c=> c==null ? '' : String(c)));
      } else {
        rows = parseCSV(String(e.target.result));
      }
      onRows(rows);
    }catch(err){
      console.error(err);
      if(err && err.message==='xlsx-reader-unavailable'){
        alert("Couldn't load the Excel reader (needs an internet connection the first time). Reconnect and try again, or save the file as CSV and import that instead.");
      } else {
        alert(`Could not read that ${isExcel?'Excel':'CSV'} file. Make sure it was exported from this app (or has matching column headers).`);
      }
    }
  };
  if(isExcel) reader.readAsArrayBuffer(file); else reader.readAsText(file);
}

/* MASTER-COPY IMPORT RULE — applied uniformly by every Import CSV button in
   this app: rows are matched by a hidden ID column when present, otherwise
   by a normalized fallback key (whitespace/capitalization don't matter).
   Matching rows are updated in place, rows with no match are added as new,
   and — every time — anything currently in the system that isn't matched by
   a row in the file is deleted (including duplicates already in the
   system), so the tab ends up an exact copy of the file. The person is
   asked to confirm before anything is deleted, and if literally nothing in
   the file matched anything expected (probably a header mismatch, not a
   genuinely empty master file) the import bails out WITHOUT deleting. */
function importCSVFile(file){
  readImportFile(file, processOrderImportRows);
}

function processOrderImportRows(rows){
    let added=0, updated=0, skipped=0;
    const missingSkus = [];
    {
      if(rows.length < 2){ alert('That file has no data rows to import.'); return; }
      const header = rows[0].map(h=>String(h).trim().toLowerCase());
      const col = name => header.indexOf(name);
      const iSO=col('sales order'), iPlan=col('plan number'), iCust=col('customer'),
            iItem=col('finished goods')>-1 ? col('finished goods') : (col('finished product')>-1 ? col('finished product') : col('item')),
            iRawMat=col('raw material'), iRawQty=col('qty'), iId=col('order id'), iUnit=col('unit'),
            iStart=col('start date'), iEnd=col('end date'), iDue=col('due date'),
            iPL=col('pl qty'), iActual=col('actual qty'), iStatus=col('status'), iMachine=col('machine');
      let planSeriesMax = planNumberSeriesMax(); // continues the PLN<YY>-##### series from the highest number already on file
      const matchedIds = new Set(); // orders touched by this CSV — anything else gets removed to make the system match the file exactly

      for(let r=1;r<rows.length;r++){
        const row = rows[r];
        if(!row || row.every(c=>String(c).trim()==='')) continue;
        const so = iSO>-1 ? String(row[iSO]||'').trim() : '';
        const plan = iPlan>-1 ? String(row[iPlan]||'').trim() : '';
        const orderId = iId>-1 ? String(row[iId]||'').trim() : '';
        if(!so && !plan && !orderId){ skipped++; continue; }

        const itemVal = iItem>-1 ? String(row[iItem]||'').trim() : '';
        const plQtyVal = iPL>-1 ? Number(row[iPL]||0) : null;

        let existing = orderId ? state.orders.find(o => o.id===orderId) : null;
        if(!existing && plan && itemVal && plQtyVal!==null){
          // No Order ID to match on — but if a row with the same Plan Number +
          // Finished Product + PL Qty + Sales Order (compared with whitespace/
          // case normalized, so "ABC-123 " and "abc-123" count as the same
          // value) is already on file, treat this as the same line rather
          // than adding a new one. Sales Order is part of this check because
          // the same plan/product/qty combo can legitimately appear more than
          // once for different customers (different SO) — e.g. two lines
          // under one plan, same finished product and PL Qty, but different
          // Sales Orders are genuinely different lines. Only the FIRST
          // matching existing row is used here — if the system already has
          // duplicate rows for the same line, the extra ones are left
          // unmatched and get swept up by the "remove anything not matched"
          // step below, which is how duplicates already in the system get
          // cleaned up on import.
          existing = state.orders.find(o =>
            normText(o.planNumber)===normText(plan) && normText(o.item)===normText(itemVal)
            && Number(o.plQty)===plQtyVal && normText(o.so)===normText(so)
          );
        }
        // Note: matching is Order ID first, then the Plan Number + Finished
        // Product + PL Qty + Sales Order combination above. Plan Number or
        // Sales Order alone are never used, since both can repeat across
        // multiple lines (the same SO can cover several plan lines, and one
        // plan can cover several raw-material/finished-product lines) —
        // matching on either alone risks silently overwriting the wrong row.

        let machineId = existing ? existing.machineId : null;
        if(iMachine>-1 && row[iMachine]){
          const mName = String(row[iMachine]).trim();
          if(mName){
            const m = state.machines.find(mm=>mm.name.toLowerCase()===mName.toLowerCase());
            machineId = m ? m.id : machineId;
          }
        }

        const patch = {};
        if(so) patch.so = so;
        if(plan){
          patch.planNumber = plan;
          const m = PLAN_NUMBER_RE.exec(plan);
          if(m){ const n = parseInt(m[1],10); if(!isNaN(n) && n>planSeriesMax) planSeriesMax = n; }
        } else if(!existing){
          // New row with no Plan Number given — assign the next one in the series.
          planSeriesMax++;
          patch.planNumber = formatPlanNumber(planSeriesMax);
        }
        if(iCust>-1) patch.customer = row[iCust];
        if(iItem>-1) patch.item = row[iItem];
        if(iRawMat>-1) patch.rawMaterial = row[iRawMat];
        if(iRawQty>-1) patch.rawQty = Number(row[iRawQty]||0);
        if(iUnit>-1) patch.unit = row[iUnit];
        if(iStart>-1) patch.startDate = parseDateToISO(row[iStart]);
        if(iEnd>-1) patch.endDate = parseDateToISO(row[iEnd]);
        if(iDue>-1) patch.dueDate = parseDateToISO(row[iDue]);
        if(iPL>-1) patch.plQty = Number(row[iPL]||0);
        if(iActual>-1) patch.actualQty = Number(row[iActual]||0);
        if(iStatus>-1 && row[iStatus]) patch.status = statusFromLabel(row[iStatus]);
        patch.machineId = machineId;

        const oldItem = existing ? existing.item : undefined;
        if(existing){
          Object.assign(existing, patch);
          updated++;
        } else {
          state.orders.unshift(Object.assign({
            id:'o'+Date.now()+Math.random().toString(36).slice(2,7),
            so: so || ('SO-'+(1000+state.orders.length+1)),
            planNumber: plan, customer:'', item:'', rawMaterial:'', rawQty:0, unit:'', plQty:0, actualQty:0,
            startDate:'', endDate:'', dueDate:'', machineId:null, status:'not-started', inventoryQtyAdded:0, history:[], splits:[]
          }, patch));
          added++;
        }
        const rec = existing || state.orders[0];
        matchedIds.add(rec.id);
        const w = syncOrderInventory(rec, oldItem);
        if(w && !missingSkus.includes(w)) missingSkus.push(w);
      }

      // Safety net: if nothing in the CSV matched or added anything at all
      // (every data row was skipped because it had no Order ID, Plan Number,
      // or Sales Order we could read), this almost certainly means the
      // column headers weren't recognized rather than a genuine "empty"
      // master file — bail out WITHOUT deleting anything, since silently
      // wiping every order because of a header mismatch would be worse than
      // doing nothing.
      if(added===0 && updated===0 && skipped===(rows.length-1)){
        alert("Could not match any rows in that CSV to expected columns (Plan Number / Sales Order / Order ID), so nothing was changed. Check that the column headers match what this app expects.");
        return;
      }

      // The CSV is the master file: anything currently in the system that no
      // row in this CSV matched — whether matched by Order ID or by the
      // Plan/Item/PL Qty/SO fallback above — gets removed so the system ends
      // up an exact copy of the file. This also cleans up any duplicate rows
      // that were already sitting in the system (only the first matching
      // duplicate gets updated above; the rest are unmatched and land here).
      const toRemove = state.orders.filter(o => !matchedIds.has(o.id));
      let removed = 0;
      if(toRemove.length){
        const ok = confirm(`This CSV doesn't include ${toRemove.length} order(s) currently in the system. Importing will DELETE ${toRemove.length===1?'that order':'those orders'} to make the system match the file exactly.\n\nContinue?`);
        if(ok){
          toRemove.forEach(o=>{
            if((o.inventoryQtyAdded||0)!==0){
              const inv = findInventoryBySku(o.item);
              if(inv) inv.stock = (Number(inv.stock)||0) - o.inventoryQtyAdded;
            }
          });
          const removeIds = new Set(toRemove.map(o=>o.id));
          state.orders = state.orders.filter(o=>!removeIds.has(o.id));
          removed = toRemove.length;
        }
      }

      render();
      let msg = `Import complete — ${added} added, ${updated} updated${removed?`, ${removed} removed (not in file)`:''}${skipped?`, ${skipped} skipped (no Plan Number / Sales Order / Order ID)`:''}.`;
      if(missingSkus.length) msg += `\n\nStock wasn't updated for these SKUs (not found in Inventory): ${missingSkus.join(', ')}`;
      alert(msg);
    }
}

/* Builds an .xlsx "Import Template" with the same columns processOrderImportRows
   reads, plus real Excel dropdown data validation on the Status and Machine
   columns (pulling live from state.machines, so renaming/adding a machine here
   automatically shows up next time someone downloads a fresh template). Hand
   this to whoever fills in orders for you — they pick from the dropdowns
   instead of typing free text, so it always comes back already formatted the
   way Import CSV/Excel expects. */
async function downloadOrderImportTemplate(){
  if(typeof ExcelJS==='undefined'){
    alert("Couldn't load the template builder (needs an internet connection the first time). Please reconnect and try again.");
    return;
  }
  try{
    const wb = new ExcelJS.Workbook();
    const sheet = wb.addWorksheet('Export Template');
    const lists = wb.addWorksheet('Lists');
    lists.state = 'veryHidden';

    const statusOptions = Object.values(STATUS_LABELS);
    const machineOptions = ['— Unassigned —', ...state.machines.map(m=>m.name)];
    statusOptions.forEach((s,i)=>{ lists.getCell(i+1,1).value = s; });
    machineOptions.forEach((m,i)=>{ lists.getCell(i+1,2).value = m; });

    const headers = ['Machine','Status','Plan Number','Raw Material','Qty','Unit','Finished Goods','PL Qty','Actual Qty','Dispatch Qty','Sales Order','Customer','Due Date','Order ID'];
    sheet.addRow(headers);
    const headRow = sheet.getRow(1);
    headRow.eachCell(c=>{
      c.font = {bold:true, color:{argb:'FFFFFFFF'}};
      c.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF182229'}};
    });
    sheet.views = [{state:'frozen', ySplit:1}];
    headers.forEach((h,i)=>{ sheet.getColumn(i+1).width = Math.max(14, h.length+4); });

    const statusColLetter = sheet.getColumn(headers.indexOf('Status')+1).letter;
    const machineColLetter = sheet.getColumn(headers.indexOf('Machine')+1).letter;
    const ROWS = 300; // dropdown-validated blank rows ready to fill in
    for(let r=2; r<=ROWS+1; r++){
      sheet.getCell(`${statusColLetter}${r}`).dataValidation = {
        type:'list', allowBlank:true, showErrorMessage:true,
        error:'Pick a value from the dropdown list.', errorTitle:'Invalid Status',
        formulae:[`Lists!$A$1:$A$${statusOptions.length}`]
      };
      sheet.getCell(`${machineColLetter}${r}`).dataValidation = {
        type:'list', allowBlank:true, showErrorMessage:true,
        error:'Pick a value from the dropdown list.', errorTitle:'Invalid Machine',
        formulae:[`Lists!$B$1:$B$${machineOptions.length}`]
      };
    }

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'production-progress-import-template.xlsx';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }catch(err){
    console.error(err);
    alert('Could not build the template file. Please try again.');
  }
}

/* ================= EXPORT HELPERS (used by every menu) =================
   Every menu gets Print / CSV / PDF through the same small "Export ▾" dropdown.
   exportMenuHTML(id) builds the markup; wireExportMenu(id, csvFn, pdfFn) wires
   the click handlers once that HTML is in the DOM. downloadCSV/pdfTable do the
   actual file generation so each view only has to describe its own columns. */
function exportMenuHTML(id, label, opts){
  const templateBtn = (opts && opts.templateLabel)
    ? `<button id="${id}-export-template-btn" ${opts.templateTitle?`title="${escAttr(opts.templateTitle)}"`:''}>⇩ ${escHtml(opts.templateLabel)}</button>`
    : '';
  return `<div class="export-wrap">
      <button class="btn" id="${id}-export-btn">${label||'Export'} ▾</button>
      <div class="export-menu" id="${id}-export-menu">
        <button id="${id}-export-print">🖨 Print</button>
        <button id="${id}-export-csv">⇩ Export as CSV</button>
        <button id="${id}-export-pdf">⇩ Export as PDF</button>
        ${templateBtn}
      </div>
    </div>`;
}
function wireExportMenu(id, csvFn, pdfFn, opts){
  const menu = $(`#${id}-export-menu`);
  const btn = $(`#${id}-export-btn`);
  if(!menu || !btn) return;
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    menu.classList.toggle('open');
  });
  document.addEventListener('click', ()=> menu.classList.remove('open'), {once:true});
  $(`#${id}-export-print`).addEventListener('click', ()=> window.print());
  $(`#${id}-export-csv`).addEventListener('click', csvFn);
  $(`#${id}-export-pdf`).addEventListener('click', pdfFn);
  if(opts && opts.templateFn){
    const tBtn = $(`#${id}-export-template-btn`);
    if(tBtn) tBtn.addEventListener('click', opts.templateFn);
  }
}
function downloadCSV(filename, header, rows){
  const esc = v => `"${String(v==null?'':v).replace(/"/g,'""')}"`;
  const csv = [header, ...rows].map(r=>r.map(esc).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
/* Note: order completions no longer auto-download anything (see completeOrder,
   setOrderStatus, setOrderField, completeSplit) — a completed order just adds
   its produced qty to Inventory and opens a Not Started row in the Dispatch
   menu. The only automatic download in this app now is the one-row Dispatch
   report, generated from the Dispatch button itself once a row actually
   ships (see dispatchRow / downloadDispatchReport below). */
function pdfTable(title, head, body, filename, orientation){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation: orientation||'landscape'});
  doc.setFontSize(14);
  doc.text(title, 14, 16);
  doc.setFontSize(9);
  doc.text(new Date().toLocaleString(), 14, 22);
  doc.autoTable({
    startY: 28,
    head:[head],
    body,
    styles:{fontSize:8, cellPadding:2.5},
    headStyles:{fillColor:[24,34,41]},
  });
  doc.save(filename);
}

/* ---- CSV import: matches by the hidden Dispatch ID column when present,
       otherwise by Sales Order + Item (SKU) + Date (normalized). Matches
       update in place (re-syncing inventory if Completed); unmatched rows are
       added as new — nothing already in the system gets deleted. ---- */
/* Follows the same MASTER-COPY IMPORT RULE as every other Import CSV button
   (see readImportFile above): accepts .csv AND .xlsx, matches by the hidden
   Dispatch ID column when present, otherwise by Sales Order + Item (SKU) +
   Date (normalized). Matches update in place, unmatched rows are added as
   new, and any dispatch currently in the system not matched by a row in the
   file is deleted (confirmed first) — reversing its stock deduction first,
   same as deleting one by hand. */
function importDispatchCSVFile(file){
  readImportFile(file, processDispatchImportRows);
}
function processDispatchImportRows(rows){
  let added=0, updated=0, skipped=0;
  if(rows.length < 2){ alert('That file has no data rows to import.'); return; }
  const header = rows[0].map(h=>String(h).trim().toLowerCase());
  const col = name => header.indexOf(name);
  const iDate=col('date'), iSO=col('sales order'), iCust=col('customer'), iSKU=col('item (sku)'), iQty=col('qty'),
        iNotes=col('notes'), iStatus=col('status'), iId=col('dispatch id');
  const matchedIds = new Set();

  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(!row || row.every(c=>String(c).trim()==='')) continue;
    const date = iDate>-1 ? String(row[iDate]||'').trim() : '';
    const so = iSO>-1 ? String(row[iSO]||'').trim() : '';
    const sku = iSKU>-1 ? String(row[iSKU]||'').trim() : '';
    if(!so && !sku){ skipped++; continue; }
    const customer = iCust>-1 ? String(row[iCust]||'').trim() : '';
    const qty = iQty>-1 ? Number(row[iQty]||0) : 0;
    const notes = iNotes>-1 ? String(row[iNotes]||'').trim() : '';
    const statusRaw = iStatus>-1 ? String(row[iStatus]||'').trim().toLowerCase() : 'not-started';
    const status = (statusRaw==='completed' || statusRaw==='complete') ? 'completed'
      : (statusRaw==='not started' || statusRaw==='not-started') ? 'not-started'
      : 'pending';
    const csvId = iId>-1 ? String(row[iId]||'').trim() : '';

    let existing = csvId ? dispatchById(csvId) : null;
    if(!existing){
      existing = state.dispatches.find(x=> normText(x.so)===normText(so) && normText(x.sku)===normText(sku) && normText(x.date)===normText(date));
    }
    if(existing){
      const oldSku = existing.sku;
      Object.assign(existing, {date, so, customer, sku, qty, notes, status});
      const warn = syncDispatchInventory(existing, oldSku);
      if(warn) noDispatchInventoryMatchWarning(warn);
      updated++;
    } else {
      existing = {id:'d'+Date.now()+Math.random().toString(36).slice(2,7), date, so, customer, sku, qty, notes, status, inventoryQtyDeducted:0};
      const warn = syncDispatchInventory(existing);
      state.dispatches.unshift(existing);
      if(warn) noDispatchInventoryMatchWarning(warn);
      added++;
    }
    matchedIds.add(existing.id);
  }

  if(added===0 && updated===0 && skipped===(rows.length-1)){
    alert("Could not match any rows in that file to expected columns (Sales Order / Item (SKU) / Dispatch ID), so nothing was changed. Check that the column headers match what this app expects.");
    return;
  }

  const toRemove = state.dispatches.filter(x=>!matchedIds.has(x.id));
  let removed = 0;
  if(toRemove.length){
    const ok = confirm(`This file doesn't include ${toRemove.length} dispatch(es) currently in the system. Importing will DELETE ${toRemove.length===1?'that dispatch':'those dispatches'} to make the system match the file exactly.\n\nContinue?`);
    if(ok){

    }

  render();

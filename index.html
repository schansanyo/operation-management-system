let progSearch = '';
let progStatusFilter = ''; // '' = all statuses
let progMachineFilter = ''; // '' = all, 'unassigned' = no machine, else machine id
let progPastDueOnly = false;
let progSort = 'status'; // default: Status (priority order — see STATUS_SORT_PRIORITY)
let progSortDir = 'asc'; // default: ascending (Pipeline first, finished orders last)
let expandedProgId = null; // id of the single Progress Report row currently expanded to show its production history (accordion — only one open at a time)

/* Human-readable "where this order stands" string used to describe a single
   point in time for the Production History log below — combines Status with
   Machine (when assigned) so a move like "In Production (Forming Machine)"
   → "In Production (Polishing)" reads as a real floor movement, not just a
   status label repeating itself. */
function orderStateDesc(status, machineId){
  const label = statusLabel(status);
  const mach = machineId ? machineName(machineId) : '';
  return mach ? `${label} (${mach})` : label;
}
/* Appends a Production History entry to the order whenever its Status and/or
   Machine actually changed (a no-op edit to some other field never touches
   this). Called with the state captured BEFORE the mutating function did its
   work, so it can diff old vs new and skip logging anything that didn't
   actually move. Kept on the order itself (o.history) so it persists with
   the rest of the order's data (saved/loaded, imported/exported via CSV, etc). */
function recordOrderMovement(o, oldStatus, oldMachineId){
  const oldDesc = orderStateDesc(oldStatus, oldMachineId);
  const newDesc = orderStateDesc(o.status, o.machineId);
  if(oldDesc===newDesc) return;
  if(!Array.isArray(o.history)) o.history = [];
  o.history.push({date: todayISO(), ts: Date.now(), text: `${oldDesc} → ${newDesc}`});
}
/* Production History for the Progress Report's expandable row — newest
   first. Falls back to a friendly empty state (rendered by the caller) when
   an order has never moved since it was created. */
function getOrderHistory(o){
  const hist = Array.isArray(o.history) ? o.history.slice() : [];
  hist.sort((a,b)=> (b.date||'').localeCompare(a.date||'') || (b.ts||0)-(a.ts||0));
  return hist;
}

// Priority used when sorting/auto-arranging the Progress Report by status:
// Pipeline rises to the top, then In Production, then the not-yet-released
// statuses, and finished orders (Completed/Cancelled) sink to the bottom.
const STATUS_SORT_PRIORITY = {
  'pipeline': 0,
  'in-production': 1,
  'in-inventory': 2,
  'for-dispatch': 3,
  'not-started': 4,
  'on-hold': 5,
  'completed': 6,
  'cancelled': 7,
};

const PROG_SORTERS = {
  machine: (a,b)=> machineName(a.machineId).localeCompare(machineName(b.machineId)),
  status: (a,b)=> (STATUS_SORT_PRIORITY[a.status]??99) - (STATUS_SORT_PRIORITY[b.status]??99),
  planNumber: (a,b)=> String(a.planNumber||'').localeCompare(String(b.planNumber||'')),
  so: (a,b)=> String(a.so||'').localeCompare(String(b.so||'')),
  customer: (a,b)=> String(a.customer||'').localeCompare(String(b.customer||'')),
  item: (a,b)=> String(a.item||'').localeCompare(String(b.item||'')),
  startDate: (a,b)=> String(a.startDate||'').localeCompare(String(b.startDate||'')),
  endDate: (a,b)=> String(a.endDate||'').localeCompare(String(b.endDate||'')),
  dueDate: (a,b)=> String(a.dueDate||'').localeCompare(String(b.dueDate||'')),
  pastDue: (a,b)=> (isPastDue(b)?1:0) - (isPastDue(a)?1:0),
  remaining: (a,b)=> remainingQty(a) - remainingQty(b),
};

/* Follows the same MASTER-COPY IMPORT RULE as every other Import CSV button
   (see readImportFile above): accepts .csv AND .xlsx, matches existing
   workers by Name of Worker (normalized). Matches update in place, unmatched
   rows are added as new, and any worker currently in the system not matched
   by a row in the file is deleted (confirmed first). */
function importManpowerCSVFile(file){
  readImportFile(file, processManpowerImportRows);
}
function processManpowerImportRows(rows){
  let added=0, updated=0, skipped=0;
  if(rows.length < 2){ alert('That file has no data rows to import.'); return; }
  const header = rows[0].map(h=>String(h).trim().toLowerCase());
  const col = name => header.indexOf(name);
  const iName=col('name of worker')>-1 ? col('name of worker') : col('name'),
        iMachine=col('machine'), iStart=col('start time'), iEnd=col('end time'), iType=col('type');
  const matchedIds = new Set();

  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(!row || row.every(c=>String(c).trim()==='')) continue;
    const name = iName>-1 ? String(row[iName]||'').trim() : '';
    if(!name){ skipped++; continue; }

    let existing = state.manpower.find(p=> normText(p.name)===normText(name));
    const patch = {name};
    if(iStart>-1) patch.startTime = row[iStart];
    if(iEnd>-1) patch.endTime = row[iEnd];
    if(iType>-1) patch.type = row[iType];
    if(iMachine>-1 && row[iMachine]){
      const mName = String(row[iMachine]).trim();
      if(mName){
        const m = state.machines.find(mm=>mm.name.toLowerCase()===mName.toLowerCase());
        patch.machineId = m ? m.id : null;
      }
    }

    if(existing){
      Object.assign(existing, patch);
      updated++;
    } else {
      existing = Object.assign(
        {id:'mp'+Date.now()+Math.random().toString(36).slice(2,7), name:'', machineId:null, startTime:'07:00', endTime:'16:00', type:'operator'},
        patch
      );
      state.manpower.unshift(existing);
      added++;
    }
    matchedIds.add(existing.id);
  }

  if(added===0 && updated===0 && skipped===(rows.length-1)){
    alert("Could not match any rows in that file to expected columns (Name of Worker), so nothing was changed. Check that the column headers match what this app expects.");
    return;
  }

  const toRemove = state.manpower.filter(p=>!matchedIds.has(p.id));
  let removed = 0;
  if(toRemove.length){
    const ok = confirm(`This file doesn't include ${toRemove.length} worker(s) currently in the system. Importing will DELETE ${toRemove.length===1?'that worker':'those workers'} to make the system match the file exactly.\n\nContinue?`);
    if(ok){
      const removeIds = new Set(toRemove.map(p=>p.id));
      state.manpower = state.manpower.filter(p=>!removeIds.has(p.id));
      removed = toRemove.length;
    }
  }

  render();
  alert(`Import complete — ${added} added, ${updated} updated${removed?`, ${removed} removed (not in file)`:''}${skipped?`, ${skipped} skipped (no name)`:''}.`);
}

/* Renders one job card. Shared by the single-job regular-machine case and
   the multi-job For Dispatch tile below. */
function machineJobCard(job, split){
  // Completing a split can happen two ways: drag/tap it onto the For
  // Dispatch tile (completes it AND hands it straight to Dispatch in one
  // move — see placeOrderOnMachine), or press ✓ Complete right here, which
  // just finishes production for this split/qty — crediting Actual Qty and
  // Inventory — without moving it to Dispatch yet (see completeSplit).
  return split ? `
        <div class="machine-job" draggable="true" data-order="${job.id}" data-split="${split.id}">
          <div class="so">${escHtml(job.planNumber || job.so)}</div>
          <div class="item">${escHtml(job.item)}</div>
          <div class="customer">${escHtml(job.customer||'')}</div>
          <div class="meta" style="font-size:10.5px;color:var(--ink-soft);">Qty ${split.qty} · ${Math.max(0.5, Math.round(split.qty*0.12*10)/10)} hr</div>
          <div class="acts">
            <button class="act-complete" data-complete="${job.id}" data-complete-split="${split.id}" title="Mark this quantity's production complete — adds it to Actual Qty and Inventory">✓ Complete</button>
            <button class="act-unassign" data-unassign="${job.id}" data-unassign-split="${split.id}" title="Send back to the Order Queue">↩ Unassign</button>
          </div>
        </div>` : `
        <div class="machine-job" draggable="true" data-order="${job.id}">
          <div class="so">${escHtml(job.planNumber || job.so)}</div>
          <div class="item">${escHtml(job.item)}</div>
          <div class="customer">${escHtml(job.customer||'')}</div>
          <div class="meta" style="font-size:10.5px;color:var(--ink-soft);">Remaining Qty ${remainingQty(job)} · ${estHours(job)} hr</div>
          <div class="acts">
            <button class="act-unassign" data-unassign="${job.id}" title="Send back to the Order Queue">↩ Unassign</button>
            <button class="act-delete" data-delete="${job.id}" title="Permanently delete this order">🗑 Delete</button>
          </div>
        </div>`;
}
function machineBox(m){
  // The "For Dispatch" tile is a status shortcut, not a real split target —
  // a whole order lands there via its plain o.machineId, same as before.
  // Every matching order is shown there, not just the first one.
  // Every other (real) machine can now carry more than one job stacked on
  // it at once too — e.g. the same item under two different PL numbers
  // both running on the same machine — so every split pointed at this
  // machine is shown, not just the first one found.
  const dispatchJobs = m.dispatch ? state.orders.filter(o=>o.machineId===m.id) : [];
  const stackedJobs = m.dispatch ? [] : splitsOnMachine(m.id);
  const hasAnyJob = m.dispatch ? dispatchJobs.length>0 : stackedJobs.length>0;
  // Job count used for the "stacked" look (border treatment + "N jobs" badge)
  // — same idea for a dispatch tile holding several orders as for a real
  // machine holding several splits, so nothing about a full For Dispatch
  // tile reads as having lost anything, it just visibly stacks like the rest.
  const jobCount = m.dispatch ? dispatchJobs.length : stackedJobs.length;
  const hasError = state.errors.some(e=>e.machine===m.name);
  const workers = state.manpower.filter(p=>p.machineId===m.id);
  // A machine with active work but nobody logged against it in Manpower is a
  // staffing gap — flag it distinctly from has-error (amber, not red) so it
  // reads as "needs coverage" rather than "something's broken". The For
  // Dispatch tile is a status shortcut, not a real work center, so it's
  // excluded from this check.
  const needsWorker = !m.dispatch && hasAnyJob && workers.length===0;
  return `
    <div class="machine ${hasAnyJob?'active':''} ${hasError?'has-error':''} ${needsWorker?'needs-worker':''} ${workers.length?'staffed':''} ${m.dispatch?'dispatch-tile':''} ${jobCount>1?'stacked':''}" data-machine="${m.id}">
      <div class="machine-name">${m.name}${jobCount>1? ` <span class="stack-count">${jobCount} jobs</span>`:''}${needsWorker? ` <span class="needs-worker-badge" title="This machine has active work but no worker assigned">No Worker</span>`:''}</div>
      ${workers.map(p=>`
        <div class="machine-worker" draggable="true" data-worker="${p.id}">
          <span class="worker-name">${escHtml(p.name)}</span>
          <span class="worker-meta">${MANPOWER_TYPES[p.type]||p.type} · ${p.startTime||'--:--'}–${p.endTime||'--:--'}</span>
          <button class="worker-unassign" data-unassign-worker="${p.id}" title="Unassign worker">✕</button>
        </div>`).join('')}
      ${m.dispatch
        ? (dispatchJobs.length ? dispatchJobs.map(j=>machineJobCard(j, null)).join('') : (workers.length? '' : `<div class="machine-idle">Drop an order here to send it straight to For Dispatch</div>`))
        : (stackedJobs.length ? stackedJobs.map(({order,split})=>machineJobCard(order, split)).join('') : (workers.length? '' : `<div class="machine-idle">Idle — drop an order here</div>`))}
    </div>`;
}

function groupedColumn(zone){
  // The For Dispatch tile also has its own dedicated spot in the queue
  // column (see renderMap), but it's a real machine too, so it still shows
  // up here in its normal factory-floor position as well.
  const items = state.machines.filter(m=>m.zone===zone);
  const groups = [];
  items.forEach(m=>{
    let g = groups.find(g=>g.name===m.grp);
    if(!g){ g = {name:m.grp, items:[]}; groups.push(g); }
    g.items.push(m);
  });
  return groups.map(g=>`
    <div class="zone-group">
      <div class="zone-label">${g.name}</div>
      ${g.items.map(machineBox).join('')}
    </div>`).join('');
}

/* ---- tap-to-place: iOS Safari never fires HTML5 drag/drop events on
   touch, so every draggable card here also works via a plain tap — tap a
   card to pick it up (it gets highlighted and every valid drop target gets
   a dashed outline), then tap a machine (or the queue it came from) to
   place it. This runs alongside the existing mouse drag/drop, which still
   works as-is on desktop. Selection is intentionally reset on every
   renderMap() call, since the DOM nodes it refers to get replaced. ---- */
let tapSelection = null; // {type:'order'|'worker', id, splitId?}
function clearTapSelection(){
  tapSelection = null;
  document.querySelectorAll('.tap-selected').forEach(el=>el.classList.remove('tap-selected'));
  document.querySelectorAll('.tap-target').forEach(el=>el.classList.remove('tap-target'));
}
function markTapTargets(){
  document.querySelectorAll('.machine').forEach(el=>el.classList.add('tap-target'));
  if(!tapSelection) return;
  if(tapSelection.type==='order'){
    // The For Dispatch tile is now just a regular .machine box (see
    // renderMap), so it's already covered by the querySelectorAll('.machine')
    // pass above. The Dispatch panel (#dispatch-panel) is a second, separate
    // drop target for the same hand-off (see wireMapDragAndTap) — mark it too.
    const qp=$('#queue-panel'); if(qp) qp.classList.add('tap-target');
    const ip=$('#inventory-panel'); if(ip) ip.classList.add('tap-target');
    const dp=$('#dispatch-panel'); if(dp) dp.classList.add('tap-target');
  }
  if(tapSelection.type==='worker'){ const wqp=$('#worker-queue-panel'); if(wqp) wqp.classList.add('tap-target'); }
}
function selectForTap(el){
  const type = el.dataset.worker ? 'worker' : 'order';
  const id = el.dataset.worker || el.dataset.order;
  const splitId = el.dataset.split || null;
  if(tapSelection && tapSelection.type===type && tapSelection.id===id && tapSelection.splitId===splitId){ clearTapSelection(); return; }
  clearTapSelection();
  tapSelection = {type, id, splitId};
  el.classList.add('tap-selected');
  markTapTargets();
}
/* Sends some or all of an order's current In-Inventory qty to the Dispatch
   menu — prompts for how many pieces (defaulting to everything currently
   ready), and opens a new Ready-for-Dispatch row for exactly that qty. This
   does NOT touch the order's own Status/Machine — the order stays wherever
   it already was (In Inventory, or still In Production for the rest of it
   if this was only a partial completion); only the new Dispatch row's own
   status governs what actually ships (see dispatchRow/setDispatchStatus),
   and the order only reaches Completed once that row is marked shipped (see
   syncOrderFromDispatch). The move is logged on the order's Movement
   History instead. Multiple partial sends over time are fine — dispatchQty
   sums every linked row regardless of status, so In Inventory just ticks
   down by whatever's been queued to Dispatch so far, and deleting one of
   these rows later (see deleteDispatch) automatically credits that qty back
   to In Inventory since it's no longer counted. */
function sendInventoryToDispatch(orderId){
  const o = orderById(orderId);
  if(!o) return;
  const ready = inventoryQty(o);
  if(ready<=0){ alert('Nothing currently in Inventory for this order to send to Dispatch.'); return; }
  const raw = prompt(`How many pieces of "${o.item}" go to Dispatch?\n(${ready} pcs currently in Inventory)`, String(ready));
  if(raw===null) return; // cancelled
  const qty = Math.floor(Number(raw));
  if(!qty || qty<=0 || qty>ready){ alert(`Enter a whole number between 1 and ${ready}.`); return; }
  state.dispatches.unshift({
    id:'d'+Date.now()+Math.random().toString(36).slice(2,7), orderId:o.id, date:todayISO(),
    producedDate: todayISO(), so:o.so, customer:o.customer, sku:o.item, qty, status:'pending',
    notes:'Auto-added from Production Plan', inventoryQtyDeducted:0
  });
  if(!Array.isArray(o.history)) o.history = [];
  o.history.push({date: todayISO(), ts: Date.now(), text: `${qty} pcs sent to Dispatch`});
  // Sending everything currently ready is the same as a whole order landing
  // on the tile (see assignOrder) — flip it to for-dispatch/machineId so it
  // stacks visibly in the For Dispatch tile, same as any other machine, in
  // stead of only being traceable via the side list. A partial send leaves
  // the order as-is (it genuinely still has qty sitting in Inventory).
  if(qty>=ready){
    o.status = 'for-dispatch';
    o.machineId = dispatchMachine().id;
  }
  render();
}
/* Routes a drop/tap-place of an order card onto a machine tile. A card
   from the Order Queue (no splitId) creates a new split there (prompting
   for qty — see createSplit); a card already on a machine (has a
   splitId) just moves that split to the new machine. The "For Dispatch"
   tile is a status shortcut rather than a real split target, so it's
   special-cased both ways — and an order that already has something sitting
   In Inventory routes to sendInventoryToDispatch instead of the older
   whole-order assignOrder path, since there's real produced qty to specify
   rather than a fresh order being sent straight to Dispatch unproduced. */
function placeOrderOnMachine(orderId, splitId, machineId){
  const m = machineById(machineId);
  if(m && m.dispatch){
    if(splitId){ completeSplit(orderId, splitId, true); return; }
    const o = orderById(orderId);
    if(o && inventoryQty(o)>0){ sendInventoryToDispatch(orderId); return; }
    assignOrder(orderId, machineId);
    return;
  }
  // Dragging a For-Dispatch order off the dispatch tile onto any other
  // machine always pulls it back to In Inventory (see unassignOrder) rather
  // than starting a new production split wherever it landed — production is
  // already finished, so there's nothing left to schedule.
  const o = orderById(orderId);
  if(o && !splitId && o.status==='for-dispatch'){ unassignOrder(orderId); return; }
  if(splitId) moveSplit(orderId, splitId, machineId);
  else createSplit(orderId, machineId);
}
function wireMapDragAndTap(){
  clearTapSelection();
  // drag events (desktop mouse) — queue chips, jobs already on a machine,
  // and workers already on a machine are all draggable, so a card can be
  // moved straight from one machine to another (or back to its queue)
  // without a separate unassign step. Orders and workers share the same
  // drop targets, so each drag is tagged with an "order:" or "worker:"
  // prefix to tell the two apart on drop; an order already split onto a
  // machine also carries its splitId after a "|". Every element below
  // also gets a click handler for the touch/tap fallback described above.
  document.querySelectorAll('.chip, .machine-job, .machine-worker').forEach(el=>{
    el.addEventListener('dragstart', e=>{
      if(el.dataset.worker) e.dataTransfer.setData('text/plain', 'worker:'+el.dataset.worker);
      else e.dataTransfer.setData('text/plain', 'order:'+el.dataset.order+(el.dataset.split? '|'+el.dataset.split : ''));
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', ()=> el.classList.remove('dragging'));
    el.addEventListener('click', e=>{
      if(e.target.closest('button')) return; // Complete/Unassign/Delete/✕ handle themselves
      selectForTap(el);
    });
  });
  document.querySelectorAll('.machine').forEach(box=>{
    box.addEventListener('dragover', e=>{ e.preventDefault(); box.classList.add('drag-over'); });
    box.addEventListener('dragleave', ()=> box.classList.remove('drag-over'));
    box.addEventListener('drop', e=>{
      e.preventDefault();
      box.classList.remove('drag-over');
      const raw = e.dataTransfer.getData('text/plain');
      if(!raw) return;
      if(raw.startsWith('worker:')) setManpowerMachine(raw.slice(7), box.dataset.machine);
      else if(raw.startsWith('order:')){
        const [orderId, splitId] = raw.slice(6).split('|');
        placeOrderOnMachine(orderId, splitId||null, box.dataset.machine);
      }
    });
    box.addEventListener('click', e=>{
      if(!tapSelection || e.target.closest('button')) return;
      if(tapSelection.type==='worker') setManpowerMachine(tapSelection.id, box.dataset.machine);
      else placeOrderOnMachine(tapSelection.id, tapSelection.splitId, box.dataset.machine);
      clearTapSelection();
    });
  });
  // dropping a job card back onto the Order Queue unassigns it — a split
  // just goes back to being unscheduled qty on the order; a whole legacy
  // For-Dispatch-tile order falls back to unassignOrder as before.
  const queuePanel = $('#queue-panel');
  if(queuePanel){
    queuePanel.addEventListener('dragover', e=>{ e.preventDefault(); queuePanel.classList.add('drag-over'); });
    queuePanel.addEventListener('dragleave', ()=> queuePanel.classList.remove('drag-over'));
    queuePanel.addEventListener('drop', e=>{
      e.preventDefault();
      queuePanel.classList.remove('drag-over');
      const raw = e.dataTransfer.getData('text/plain');
      if(raw && raw.startsWith('order:')){
        const [orderId, splitId] = raw.slice(6).split('|');
        if(splitId) unassignSplit(orderId, splitId); else unassignOrder(orderId);
      }
    });
    queuePanel.addEventListener('click', e=>{
      if(!tapSelection || tapSelection.type!=='order' || e.target.closest('.chip')) return;
      if(tapSelection.splitId) unassignSplit(tapSelection.id, tapSelection.splitId); else unassignOrder(tapSelection.id);
      clearTapSelection();
    });
  }
  // Dropping a job card onto the Inventory panel marks that portion Complete
  // — a split card (still mid-run on a machine) calls completeSplit, which
  // credits its qty to Actual Qty/Inventory and leaves the rest of the order
  // untouched (partial completions land here too, they don't disappear back
  // into the queue). A card already on the For Dispatch tile instead falls
  // back to unassignOrder, since production there is already finished and
  // this is just pulling it off the outgoing hand-off. Any other card (an
  // unscheduled Pipeline/On Hold/queue chip with nothing produced yet) is
  // treated as "this order is done" via completeOrder.
  const inventoryPanel = $('#inventory-panel');
  function dropOnInventory(orderId, splitId){
    if(splitId){ completeSplit(orderId, splitId); return; }
    const o = orderById(orderId);
    if(o && o.status==='for-dispatch'){ unassignOrder(orderId); return; }
    completeOrder(orderId);
  }
  if(inventoryPanel){
    inventoryPanel.addEventListener('dragover', e=>{ e.preventDefault(); inventoryPanel.classList.add('drag-over'); });
    inventoryPanel.addEventListener('dragleave', ()=> inventoryPanel.classList.remove('drag-over'));
    inventoryPanel.addEventListener('drop', e=>{
      e.preventDefault();
      inventoryPanel.classList.remove('drag-over');
      const raw = e.dataTransfer.getData('text/plain');
      if(raw && raw.startsWith('order:')){
        const [orderId, splitId] = raw.slice(6).split('|');
        dropOnInventory(orderId, splitId||null);
      }
    });
    inventoryPanel.addEventListener('click', e=>{
      if(!tapSelection || tapSelection.type!=='order' || e.target.closest('.chip') || e.target.closest('button')) return;
      dropOnInventory(tapSelection.id, tapSelection.splitId);
      clearTapSelection();
    });
  }
  // The Dispatch panel is a second drop target for the exact same hand-off
  // as the map's For Dispatch tile — routes through the same
  // placeOrderOnMachine logic (targeting dispatchMachine().id), so dropping
  // an order/split here does exactly what dropping it on the tile does:
  // a whole In-Inventory order goes through sendInventoryToDispatch, a split
  // still on a machine completes straight to Dispatch, etc.
  const dispatchPanel = $('#dispatch-panel');
  if(dispatchPanel){
    dispatchPanel.addEventListener('dragover', e=>{ e.preventDefault(); dispatchPanel.classList.add('drag-over'); });
    dispatchPanel.addEventListener('dragleave', ()=> dispatchPanel.classList.remove('drag-over'));
    dispatchPanel.addEventListener('drop', e=>{
      e.preventDefault();
      dispatchPanel.classList.remove('drag-over');
      const raw = e.dataTransfer.getData('text/plain');
      if(raw && raw.startsWith('order:')){
        const [orderId, splitId] = raw.slice(6).split('|');
        placeOrderOnMachine(orderId, splitId||null, dispatchMachine().id);
      }
    });
    dispatchPanel.addEventListener('click', e=>{
      if(!tapSelection || tapSelection.type!=='order' || e.target.closest('.chip') || e.target.closest('button')) return;
      placeOrderOnMachine(tapSelection.id, tapSelection.splitId, dispatchMachine().id);
      clearTapSelection();
    });
  }
  // dropping a worker card back onto the Worker Queue unassigns it from its machine
  const workerQueuePanel = $('#worker-queue-panel');
  if(workerQueuePanel){
    workerQueuePanel.addEventListener('dragover', e=>{ e.preventDefault(); workerQueuePanel.classList.add('drag-over'); });
    workerQueuePanel.addEventListener('dragleave', ()=> workerQueuePanel.classList.remove('drag-over'));
    workerQueuePanel.addEventListener('drop', e=>{
      e.preventDefault();
      workerQueuePanel.classList.remove('drag-over');
      const raw = e.dataTransfer.getData('text/plain');
      if(raw && raw.startsWith('worker:')) setManpowerMachine(raw.slice(7), null);
    });
    workerQueuePanel.addEventListener('click', e=>{
      if(!tapSelection || tapSelection.type!=='worker' || e.target.closest('.chip')) return;
      setManpowerMachine(tapSelection.id, null);
      clearTapSelection();
    });
  }
  // The For Dispatch tile is now rendered as a real .machine box (see
  // renderMap) instead of a separate "Ready for Dispatch" drop panel, so its
  // drag/drop and tap handling is already covered by the generic '.machine'
  // wiring above (drop -> placeOrderOnMachine, which special-cases m.dispatch
  // tiles into completeSplit/setOrderStatus). No extra wiring needed here.
}

  // Unscheduled Qty — for as long as it still has unscheduled qty left to

  // what's already been produced and what's currently running as splits).
  const unassigned = state.orders.filter(o=>
    unscheduledQty(o)>0 && (o.status==='pipeline' || o.status==='on-hold' || o.status==='in-production'));
  // Shows any order sitting on the shelf with Ready Qty on hand — not just
  // orders whose overall status is "In Inventory". A split completed off an
  // order that still has other splits running (or unscheduled qty left) is a
  // partial completion: the order's status stays whatever it was, but the
  // completed qty is still real stock, so it belongs here too rather than
  // disappearing until the very last piece of the order is done. For-Dispatch
  // and Completed orders are excluded since their qty is already shown/being

  const invReady = state.orders.filter(o=>

/* ================= DISPATCH ================= */
const dispatchById = id => state.dispatches.find(d=>d.id===id);

/* Same pattern as syncOrderInventory, but deducts instead of adds: a Completed
   dispatch removes its qty from the matching SKU's stock; reopening it, editing
   the qty, or changing the SKU reverses/reapplies the difference so nothing
   double-counts. Returns the SKU string on a no-match (for a warning), else null. */
function syncDispatchInventory(d, oldSku){
  if(oldSku!==undefined && oldSku!==null && oldSku!==d.sku && (d.inventoryQtyDeducted||0)!==0){
    const oldInv = findInventoryBySku(oldSku);
    if(oldInv) oldInv.stock = (Number(oldInv.stock)||0) + d.inventoryQtyDeducted;
    d.inventoryQtyDeducted = 0;
  }
  const shouldHaveDeducted = d.status==='completed' ? (Number(d.qty)||0) : 0;
  const already = Number(d.inventoryQtyDeducted)||0;
  const delta = shouldHaveDeducted - already;
  if(delta===0) return null;
  const inv = findInventoryBySku(d.sku);
  if(!inv) return d.sku;
  inv.stock = (Number(inv.stock)||0) - delta;
  d.inventoryQtyDeducted = shouldHaveDeducted;
  return null;
}
function noDispatchInventoryMatchWarning(sku){
  alert(`"${sku}" isn't in Inventory yet, so stock wasn't deducted. Add that SKU in Inventory, then re-save this dispatch to sync it.`);
}

function addBlankDispatch(){
  state.dispatches.unshift({
    id:'d'+Date.now(), date:todayISO(), so:'', customer:'New Customer', sku:'',
    qty:0, status:'not-started', notes:'', inventoryQtyDeducted:0
  });
  render();
}
function deleteDispatch(id){
  const d = dispatchById(id);
  if(d && (d.inventoryQtyDeducted||0)!==0){
    const inv = findInventoryBySku(d.sku);
    if(inv) inv.stock = (Number(inv.stock)||0) + d.inventoryQtyDeducted;
  }
  state.dispatches = state.dispatches.filter(d=>d.id!==id);
  render();
}
/* Closes the loop back to the Production Report for a Dispatch row that was
   auto-opened from an order (see createDispatchFromOrder). Once the shipment
   is actually marked Complete here (via the Dispatch button — see
   dispatchRow, which already downloads its own report for this event), the
   linked order flips to Completed too — the job is now produced AND shipped,
   not just queued. Reopening the Dispatch back to Pending afterward reverses
   it, dropping the order back to For Dispatch rather than leaving it stuck
   on Completed for goods that, as far as this row shows, haven't shipped
   after all.

   IMPORTANT: a single order can have several linked Dispatch rows — one per
   completed split (see completeSplit) — each covering only PART of the
   order's PL Qty. Shipping one of those partial rows must NOT complete the
   whole order if there's still unproduced qty sitting elsewhere (another
   split still running, or qty that hasn't even been scheduled yet). So this
   only flips the order to Completed once production is genuinely finished
   (no splits still open, nothing left against the plan) — otherwise the
   order is left exactly as-is (e.g. still In Production) and only that one
   Dispatch row is marked shipped. */
function syncOrderFromDispatch(d){
  if(!d.orderId) return null;
  const o = orderById(d.orderId);
  if(!o) return null;
  if(d.status==='completed'){
    if(o.status==='completed' || o.status==='cancelled') return null;
    if((o.splits && o.splits.length) || remainingQty(o)>0) return null;
    o.status = 'completed';
    o.machineId = null;
    if(!o.endDate) o.endDate = d.date || todayISO();
  }else if(o.status==='completed'){
    o.status = 'for-dispatch';
    const dm = dispatchMachine();
    o.machineId = dm ? dm.id : null;
  }else{
    return null;
  }
  return syncOrderInventory(o);
}
function setDispatchStatus(id, status){
  const d = dispatchById(id);
  if(!d) return;
  d.status = status;
  const warn = syncDispatchInventory(d);
  const orderWarn = syncOrderFromDispatch(d);
  render();
  if(warn) noDispatchInventoryMatchWarning(warn);
  else if(orderWarn) noInventoryMatchWarning(orderWarn);
}
/* The "Dispatch" button is what actually ships a row out — it replaces the old
   "Complete" option in the Status dropdown (see renderDispatch), and only
   appears once a row's status is Ready for Dispatch ("pending"): a freshly
   produced row lands here at Not Started first (see createDispatchFromOrder/
   completeSplit) and needs a manual flip to Ready for Dispatch before it can
   be shipped — this is the gate that stops a report firing the instant
   production finishes. Confirms with the user first (qty + destination, since
   this deducts stock), then stamps today's date as the actual ship date,
   marks the row Complete (which runs the normal inventory-deduction +
   linked-order sync via setDispatchStatus), and finally downloads a one-row
   PDF report of the shipment so there's a paper trail for what went out
   today — this is the ONLY place in the app that auto-downloads a report;
   completing an order in the Progress Report never does. */
function dispatchRow(id){
  const d = dispatchById(id);
  if(!d || d.status!=='pending') return;
  const qty = Number(d.qty)||0;
  const ok = confirm(`Dispatch ${qty} pcs of "${d.sku||'(no SKU)'}" to ${d.customer||'this customer'}?\n\nThis will deduct ${qty} pcs from Inventory stock and download a dispatch report dated today (${todayISO()}).`);
  if(!ok) return;
  d.date = todayISO();
  setDispatchStatus(id, 'completed');
  downloadDispatchReport(d);
}
/* One-row PDF "proof of shipment" for a single dispatch, built the moment it's
   marked Complete via the Dispatch button. Today's date is the headline detail
   here (per the warehouse workflow this is meant for), so it's shown large at
   the top as well as in the table itself. */
function downloadDispatchReport(d){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation:'portrait'});
    doc.setFontSize(16);
    doc.text('Dispatch Report', 14, 18);
    doc.setFontSize(11);
    doc.text(`Date: ${d.date || todayISO()}`, 14, 27);
    doc.autoTable({
      startY: 34,
      head: [['Date','Sales Order','Customer','Item (SKU)','Qty','Notes','Status']],
      body: [[d.date||'', d.so||'', d.customer||'', d.sku||'', String(d.qty||0), d.notes||'', dispatchStatusLabel(d.status)]],
      styles:{fontSize:9, cellPadding:3},
      headStyles:{fillColor:[139,92,246]},
    });
    const safeSo = String(d.so || d.customer || d.id).replace(/[^a-z0-9\-]+/gi,'_');
    doc.save(`dispatch-${safeSo}-${d.date||todayISO()}.pdf`);
  }catch(e){ /* never let a report failure block the actual dispatch */ }
}
/* The master "🚚 Dispatch All Ready" button beside Export: a bulk version of
   dispatchRow — one confirmation covers every row currently Ready for
   Dispatch (status 'pending'), then each of them is stamped with today's
   date, deducted from Inventory, and marked Complete, exactly as if the
   Dispatch button had been pressed on each one individually. Rows still at
   Not Started are left untouched and excluded entirely — they haven't been
   queued to ship yet. Instead of a PDF per row, this downloads one CSV
   summarizing everything that just went out. */
function dispatchAllReady(){
  const ready = state.dispatches.filter(d=>d.status==='pending');
  if(!ready.length){ alert('No dispatches are marked "Ready for Dispatch" right now — nothing to dispatch.'); return; }
  const totalQty = ready.reduce((s,d)=> s + (Number(d.qty)||0), 0);
  const ok = confirm(`Dispatch all ${ready.length} row(s) marked "Ready for Dispatch" (${totalQty} pcs total)?\n\nThis deducts stock for each SKU in Inventory and downloads one CSV summary dated today (${todayISO()}). Rows still at "Not Started" are left alone.`);
  if(!ok) return;
  const today = todayISO();
  const missingSkus = [];
  ready.forEach(d=>{
    d.date = today;
    d.status = 'completed';
    const warn = syncDispatchInventory(d);
    if(warn) missingSkus.push(warn);
    syncOrderFromDispatch(d);
  });
  render();
  downloadDispatchSummaryCSV(ready, today);
  if(missingSkus.length){
    const uniq = [...new Set(missingSkus)];
    alert(`Stock wasn't deducted for these SKUs (not found in Inventory): ${uniq.join(', ')}`);
  }
}
function downloadDispatchSummaryCSV(rows, date){
  const body = rows.map(d=>[d.date||'', d.so||'', d.customer||'', d.sku||'', d.qty, d.notes||'', dispatchStatusLabel(d.status)]);
  downloadCSV(`dispatch-summary-${date}.csv`, ['Date','Sales Order','Customer','Item (SKU)','Qty','Notes','Status'], body);
}
function setDispatchField(id, field, value){
  const d = dispatchById(id);
  if(!d) return;
  const oldSku = field==='sku' ? d.sku : undefined;
  d[field] = field==='qty' ? Number(value) : value;
  let warn = null;
  if(field==='qty' || field==='sku'){
    warn = syncDispatchInventory(d, oldSku);
  }
  refreshDispatchRow(id);
  saveState();
  if(warn) noDispatchInventoryMatchWarning(warn);
}

}

const receivingById = id => state.receiving.find(r=>r.id===id);

/* Every new receiving row gets the next number in the series (RCV-0001, RCV-0002, …).
   The counter only ever moves forward, even if an old entry is later deleted, so
   numbers already printed or shared never get reused. */
function nextReceivingNumber(){
  const n = state.receivingSeq || 1;
  state.receivingSeq = n + 1;
  return 'RCV-' + String(n).padStart(4, '0');
}

/* Mirror of syncDispatchInventory, but adds instead of deducts: a Completed
   receiving adds its qty to the matching SKU's stock; reopening it, editing
   the qty, or changing the SKU reverses/reapplies the difference so nothing
   double-counts. Returns the SKU string on a no-match (for a warning), else null. */
function syncReceivingInventory(r, oldSku){
  if(oldSku!==undefined && oldSku!==null && oldSku!==r.sku && (r.inventoryQtyAdded||0)!==0){
    const oldInv = findInventoryBySku(oldSku);
    if(oldInv) oldInv.stock = (Number(oldInv.stock)||0) - r.inventoryQtyAdded;
    r.inventoryQtyAdded = 0;
  }
  const shouldHaveAdded = r.status==='completed' ? (Number(r.qty)||0) : 0;
  const already = Number(r.inventoryQtyAdded)||0;
  const delta = shouldHaveAdded - already;
  if(delta===0) return null;
  const inv = findInventoryBySku(r.sku);
  if(!inv) return r.sku;
  inv.stock = (Number(inv.stock)||0) + delta;
  r.inventoryQtyAdded = shouldHaveAdded;
  return null;
}
function noReceivingInventoryMatchWarning(sku){
  alert(`"${sku}" isn't in Inventory yet, so stock wasn't added. Add that SKU in Inventory, then re-save this receiving to sync it.`);
}

function addBlankReceiving(){
  state.receiving.unshift({
    id:'r'+Date.now(), receivingNo: nextReceivingNumber(), date:todayISO(), po:'', supplier:'New Supplier',
    sku:'', qty:0, status:'pending', notes:'', inventoryQtyAdded:0
  });
  render();
}
function deleteReceiving(id){
  const r = receivingById(id);
  if(r && (r.inventoryQtyAdded||0)!==0){
    const inv = findInventoryBySku(r.sku);
    if(inv) inv.stock = (Number(inv.stock)||0) - r.inventoryQtyAdded;
  }
  state.receiving = state.receiving.filter(r=>r.id!==id);
  render();
}
function setReceivingStatus(id, status){
  const r = receivingById(id);
  if(!r) return;
  r.status = status;
  const warn = syncReceivingInventory(r);
  render();
  if(warn) noReceivingInventoryMatchWarning(warn);
}

  if(!r) return;

  let warn = null;
  if(field==='qty' || field==='sku'){
    warn = syncReceivingInventory(r, oldSku);
  }
  saveState();
  if(warn) noReceivingInventoryMatchWarning(warn);
}

/* ================= RENDER: INVENTORY ================= */
let invFilter = '';
let invGradeFilter = '';
let invTypeFilter = '';
let invStatusFilter = ''; // '' = all, 'reorder' = below reorder point only, 'ok' = above
let expandedInvIdx = null; // realIdx of the single inventory row currently expanded to show movement history (accordion — only one open at a time)

const CATEGORY_LABELS = {
  'AB': 'Angle Bar (AB)',
  'PL': 'Plate (PL)',
  'SH': 'Sheet (SH)',
  'PWD': 'Pipe Welded (PWD)',
  'HL': 'Hairline Finish (HL)',
  'CD': 'Coil (CD)',
  'COIL-SLT': 'SS Coil Slitted (COIL-SLT)',
  'COUPLING': 'Coupling',
};
/* Category is driven entirely by the item's "type" field — which is exactly
   the "Type" column in the Inventory CSV import/export. Known short codes get
   a friendlier label; anything else (including new types brought in via CSV)
   is shown as typed. */
function categoryLabel(type){
  if(!type) return 'Uncategorized';
  return CATEGORY_LABELS[type] || type;
}
/* Friendly display name for a SKU/name string used elsewhere in the app —
   resolves to the matching inventory item's Product name when there is one,
   otherwise falls back to whatever text was passed in (e.g. free-typed raw
   material names that aren't tracked as their own inventory row). */
function invDisplayName(text){
  if(!text) return '—';
  const inv = findInventoryBySku(text);
  return inv ? (inv.name || inv.sku) : text;
}
/* Movement history for a given SKU. Combines:
   - completed Receiving (stock in)
   - every order-linked Dispatch row (stock in the moment it's PRODUCED — see
     completeSplit / createDispatchFromOrder, which create one of these the
     instant a produced qty lands in Inventory, whether or not the rest of
     the order — or even that row's own shipment — is finished yet) plus,
     separately, that same row going OUT again once it's actually shipped
     (status Complete, dated by its ship date rather than its produced date)
   - completed production Orders' raw material consumption (stock OUT of the
     raw material's row, "To" the finished product it became)
   - a fallback "stock in" entry straight from the order for any completed/
     for-dispatch order that predates the Dispatch-row-per-completion
     behavior above (e.g. legacy data) and so has no linked Dispatch row. */
function getMovementHistory(sku){
  const key = (sku||'').trim().toLowerCase();
  const moves = [];
  state.receiving.forEach(r=>{
    if(r.status==='completed' && (r.sku||'').trim().toLowerCase()===key){
      moves.push({qty:Math.abs(Number(r.qty)||0), date:r.date||'', from:r.supplier||'—', to:'—'});
    }
  });
  state.dispatches.forEach(d=>{
    // Only order-linked rows represent an actual production event — a
    // manually-typed Dispatch entry (no orderId) ships pre-existing stock,
    // it doesn't produce new stock, so it's excluded from the "in" side.
    if(d.orderId && (d.sku||'').trim().toLowerCase()===key){
      moves.push({qty:Math.abs(Number(d.qty)||0), date:d.producedDate||d.date||'', from:d.so?`Produced (${d.so})`:'Produced', to:'—'});
    }
    if(d.status==='completed' && (d.sku||'').trim().toLowerCase()===key){
      moves.push({qty:-Math.abs(Number(d.qty)||0), date:d.date||'', from:'—', to:d.customer||'—'});
    }
  });
  const linkedOrderIds = new Set(state.dispatches.map(d=>d.orderId).filter(Boolean));
  state.orders.forEach(o=>{
    if(o.status!=='completed' && o.status!=='for-dispatch') return;
    const moveDate = o.endDate || o.dueDate || '';
    // This SKU was the raw material consumed by the order — stock out, headed to the finished product.
    if((o.rawMaterial||'').trim().toLowerCase()===key && Number(o.rawQty)>0){
      moves.push({qty:-Math.abs(Number(o.rawQty)||0), date:moveDate, from:'—', to:invDisplayName(o.item)});
    }
    if(!linkedOrderIds.has(o.id) && (o.item||'').trim().toLowerCase()===key && Number(o.actualQty)>0){
      moves.push({qty:Math.abs(Number(o.actualQty)||0), date:moveDate, from:o.rawMaterial? invDisplayName(o.rawMaterial) : '—', to:'—'});
    }
  });
  moves.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  return moves;
}
/* Quantity breakdown for a given SKU:
   - In Production: planned qty on orders actively being produced for this item
   - Reserved: qty on pending dispatches already allocated to a customer for this item
   Ready Stock is just the item's own "stock" field (on hand, unencumbered). */
function getQuantityBreakdown(sku){
  const key = (sku||'').trim().toLowerCase();
  const inProduction = state.orders
    .filter(o=> o.status==='in-production' && (o.item||'').trim().toLowerCase()===key)
    .reduce((sum,o)=> sum + productionQty(o), 0);
  const reserved = state.dispatches
    .filter(d=> d.status!=='completed' && (d.sku||'').trim().toLowerCase()===key)
    .reduce((sum,d)=> sum + (Number(d.qty)||0), 0);
  return {inProduction, reserved};
}
function deleteInventoryItem(idx){
  state.inventory.splice(idx, 1);
  expandedInvIdx = null; // indices shift after a delete, so drop any open detail panel
  render();
}
function setInventoryField(idx, field, value){
  const item = state.inventory[idx];
  if(!item) return;
  item[field] = (field==='stock' || field==='rp') ? Number(value) : value;
  refreshInventoryRow(idx);
  saveState();
}
function refreshInventoryRow(idx){
  const item = state.inventory[idx];
  if(!item) return;
  const cell = document.querySelector(`[data-invstatus="${idx}"]`);
  if(cell){
    const low = item.stock<=item.rp;
    cell.innerHTML = low? '<span class="pill err status-badge">REORDER</span>' : '<span class="pill ok status-badge">OK</span>';
  }
}

function exportInventoryCSV(){

    i.stock, i.rp, (i.stock<=i.rp ? 'REORDER' : 'OK')
  ]);
  const esc = v => `"${String(v).replace(/"/g,'""')}"`;
  const csv = [header, ...rows].map(r=>r.map(esc).join(',')).join('\r\n');

  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

/* Follows the same MASTER-COPY IMPORT RULE as every other Import CSV button
   (see readImportFile above): accepts .csv AND .xlsx, matches existing rows
   by SKU (normalized), so re-importing an edited export updates stock/
   reorder points in place instead of duplicating. "Type" is the column that
   drives each row's Category. Matches update in place, unmatched rows are
   added as new, and any SKU currently in the system not matched by a row in
   the file is deleted (confirmed first). */
function importInventoryCSVFile(file){
  readImportFile(file, processInventoryImportRows);
}
function processInventoryImportRows(rows){
  let added=0, updated=0, skipped=0;
  if(rows.length < 2){ alert('That file has no data rows to import.'); return; }
  const header = rows[0].map(h=>String(h).trim().toLowerCase());
  const col = name => header.indexOf(name);
  const iSKU=col('sku'), iName=(col('product')>-1?col('product'):col('name')), iGrade=col('grade'), iType=col('type'), iThk=col('thickness'),
        iD1=col('dimension 1'), iD2=col('dimension 2'), iD3=col('dimension 3'), iLen=col('length'),
        iStock=col('current stock')>-1?col('current stock'):col('quantity on hand'), iRP=col('reorder point');
  const matchedSkus = new Set();

  for(let r=1;r<rows.length;r++){
    const row = rows[r];
    if(!row || row.every(c=>String(c).trim()==='')) continue;
    const sku = iSKU>-1 ? String(row[iSKU]||'').trim() : '';
    if(!sku){ skipped++; continue; }

    let existing = state.inventory.find(i=> normText(i.sku)===normText(sku));
    const patch = {sku};
    if(iName>-1) patch.name = row[iName];
    if(iGrade>-1) patch.grade = row[iGrade];
    if(iType>-1) patch.type = row[iType];
    if(iThk>-1) patch.thickness = row[iThk];
    if(iD1>-1) patch.dim1 = row[iD1];
    if(iD2>-1) patch.dim2 = row[iD2];
    if(iD3>-1) patch.dim3 = row[iD3];
    if(iLen>-1) patch.length = row[iLen];
    if(iStock>-1) patch.stock = Number(row[iStock]||0);
    if(iRP>-1) patch.rp = Number(row[iRP]||0);

    if(existing){
      Object.assign(existing, patch);
      if(existing.name===undefined) existing.name = existing.sku;
      updated++;
    } else {
      existing = Object.assign(
        {sku:'', name:sku, grade:'304', type:'AB', thickness:'', dim1:'', dim2:'', dim3:'', length:'', stock:0, rp:0},
        patch
      );
      state.inventory.unshift(existing);
      added++;
    }
    matchedSkus.add(normText(existing.sku));
  }

  if(added===0 && updated===0 && skipped===(rows.length-1)){
    alert("Could not match any rows in that file to expected columns (SKU), so nothing was changed. Check that the column headers match what this app expects.");
    return;
  }

  const toRemove = state.inventory.filter(i=>!matchedSkus.has(normText(i.sku)));
  let removed = 0;
  if(toRemove.length){
    const ok = confirm(`This file doesn't include ${toRemove.length} SKU(s) currently in the system. Importing will DELETE ${toRemove.length===1?'that SKU':'those SKUs'} to make the system match the file exactly.\n\nContinue?`);
    if(ok){
      const removeSkus = new Set(toRemove.map(i=>normText(i.sku)));
      state.inventory = state.inventory.filter(i=>!removeSkus.has(normText(i.sku)));
      removed = toRemove.length;
    }
  }

  render();
  alert(`Import complete — ${added} added, ${updated} updated${removed?`, ${removed} removed (not in file)`:''}${skipped?`, ${skipped} skipped (no SKU)`:''}.`);
}

const STORAGE_KEY = 'stainless_ops_state_v1';

/* ---- Supabase cloud sync ----
   Fill these two values in from your Supabase project (Settings -> API):
   - SUPABASE_URL looks like  https://xxxxxxxxxxxx.supabase.co
   - SUPABASE_ANON_KEY is the long "anon public" key on that same page.
   Leave them blank ('') to run in local-only mode (each device keeps its
   own separate copy, like before). Once filled in, every device that opens
   this same page reads/writes the same shared data. */
const SUPABASE_URL = 'https://hmgpjgnqttugxhabsqir.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_jU2tCRxm9JiOkpsSqbFOiw_3bmvBnBM';
const SUPABASE_TABLE = 'app_state';
const SUPABASE_ROW_ID = 'main';
const CLOUD_ENABLED = !!(SUPABASE_URL && SUPABASE_ANON_KEY);
const sb = CLOUD_ENABLED ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let lastSyncedAt = null;   // updated_at timestamp of the data currently shown
let syncPushTimer = null;  // debounce handle for pushing to the cloud
let isApplyingRemote = false; // true while a remote update is being applied, to avoid re-triggering a push

function currentPersistedBlob(){
  return {
    machines: state.machines, orders: state.orders, inventory: state.inventory,
    errors: state.errors, logbook: state.logbook, dispatches: state.dispatches,
    receiving: state.receiving, receivingSeq: state.receivingSeq, manpower: state.manpower
  };
}

function setSyncIndicator(text){
  const el = $('#save-indicator');
  if(!el) return;
  el.textContent = text;
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}

function saveState(){
  if(isApplyingRemote) return; // don't echo a remote update straight back to the cloud
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(currentPersistedBlob()));
  }catch(e){ console.warn('Could not save to localStorage', e); }

  if(!CLOUD_ENABLED){
    setSyncIndicator('Saved ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ' (this device only)');
    return;
  }
  setSyncIndicator('Syncing…');
  clearTimeout(syncPushTimer);
  syncPushTimer = setTimeout(pushStateToCloud, 700);
}

async function pushStateToCloud(){
  try{
    const nowIso = new Date().toISOString();
    const { error } = await sb.from(SUPABASE_TABLE).upsert({
      id: SUPABASE_ROW_ID, data: currentPersistedBlob(), updated_at: nowIso
    });
    if(error) throw error;
    lastSyncedAt = nowIso;
    setSyncIndicator('Synced ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
  }catch(e){
    console.warn('Cloud sync failed, saved locally only', e);
    setSyncIndicator('Sync failed — saved on this device only');
  }
}

async function pullStateFromCloud(){
  if(!CLOUD_ENABLED) return null;
  try{
    const { data, error } = await sb.from(SUPABASE_TABLE).select('data, updated_at').eq('id', SUPABASE_ROW_ID).maybeSingle();
    if(error) throw error;
    return data || null;
  }catch(e){
    console.warn('Could not reach Supabase, using local data', e);
    return null;
  }
}

/* Poll for changes made from other devices and merge them in without
   clobbering whatever the person on THIS device is in the middle of typing. */
function startCloudPolling(){
  if(!CLOUD_ENABLED) return;
  setInterval(async ()=>{
    const remote = await pullStateFromCloud();
    if(!remote || !remote.updated_at) return;
    if(lastSyncedAt && remote.updated_at <= lastSyncedAt) return; // nothing newer
    const activeEl = document.activeElement;
    const isTyping = activeEl && (activeEl.tagName==='INPUT' || activeEl.tagName==='TEXTAREA' || activeEl.tagName==='SELECT');
    if(isTyping) return; // wait for them to finish this edit before overwriting the screen
    applyLoadedData(remote.data);
    lastSyncedAt = remote.updated_at;
    isApplyingRemote = true;
    render();
    isApplyingRemote = false;
    setSyncIndicator('Updated from another device ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}));
  }, 15000);
}

function applyLoadedData(saved){
    // machines now mirror the factory floor sketch — always use the current layout
    // rather than a possibly-stale saved one (ids/zones may not match old data).
    const validMachineIds = new Set(state.machines.map(m=>m.id));
    if(saved.orders){
      state.orders = saved.orders.map(o=>{
        const migrated = Object.assign({}, o);
        if(migrated.plQty===undefined){ migrated.plQty = migrated.qty || 0; delete migrated.qty; }
        if(migrated.actualQty===undefined) migrated.actualQty = 0;
        if(migrated.planNumber===undefined) migrated.planNumber = '';
        if(migrated.rawMaterial===undefined) migrated.rawMaterial = '';
        if(migrated.rawQty===undefined) migrated.rawQty = 0;
        if(migrated.startDate===undefined) migrated.startDate = '';
        if(migrated.endDate===undefined) migrated.endDate = '';
        if(migrated.dueDate===undefined) migrated.dueDate = '';
        if(migrated.inventoryQtyAdded===undefined) migrated.inventoryQtyAdded = 0;
        if(migrated.splits===undefined) migrated.splits = [];
        // Older saved data assigned an order to a single machine via
        // machineId. Convert any such in-production assignment (on a real
        // machine, not the For Dispatch shortcut tile) into a split, so it
        // keeps showing on that machine tile under the new multi-machine
        // model instead of silently disappearing from the Map.
        if(migrated.machineId && validMachineIds.has(migrated.machineId)){
          const dm = dispatchMachine();
          if((!dm || migrated.machineId!==dm.id) && migrated.status==='in-production'){
            const legacyRemaining = (Number(migrated.plQty)||0) - (Number(migrated.actualQty)||0);
            if(legacyRemaining>0){
              migrated.splits.push({id:'sp'+Date.now()+Math.random().toString(36).slice(2,7), machineId: migrated.machineId, qty: legacyRemaining});
            }
            migrated.machineId = null;
          }
        }
        if(migrated.machineId && !validMachineIds.has(migrated.machineId)) migrated.machineId = null;
        return migrated;
      });
    }
    if(saved.inventory){
      // migrate older rows that used a single "width" field
      state.inventory = saved.inventory.map(i=>{
        if(i.dim1===undefined){
          return {sku:i.sku, name:i.name||i.sku, grade:i.grade, type:i.type, thickness:i.thickness,
            dim1:i.width||'', dim2:i.width||'', dim3:'', length:"20'", stock:i.stock, rp:i.rp};
        }
        // migrate older rows saved before Product (name) was split out from SKU
        if(i.name===undefined) return Object.assign({}, i, {name:i.sku});
        return i;
      });
    }
    if(saved.errors) state.errors = saved.errors;
    if(saved.dispatches){
      state.dispatches = saved.dispatches.map(d=>{
        const migrated = Object.assign({}, d);
        if(migrated.so===undefined) migrated.so = '';
        if(migrated.notes===undefined) migrated.notes = '';
        if(migrated.inventoryQtyDeducted===undefined) migrated.inventoryQtyDeducted = 0;
        if(migrated.status===undefined) migrated.status = 'pending';
        if(migrated.orderId===undefined) migrated.orderId = null;
        return migrated;
      });
    }
    if(saved.logbook){
      state.logbook = saved.logbook.map(l=> validMachineIds.has(l.machineId) ? l : Object.assign({}, l, {machineId: state.machines[0].id}));
    }
    if(saved.receivingSeq!==undefined) state.receivingSeq = saved.receivingSeq;
    if(saved.receiving){
      state.receiving = saved.receiving.map(r=>{
        const migrated = Object.assign({}, r);
        if(migrated.po===undefined) migrated.po = '';
        if(migrated.notes===undefined) migrated.notes = '';
        if(migrated.inventoryQtyAdded===undefined) migrated.inventoryQtyAdded = 0;
        if(migrated.status===undefined) migrated.status = 'pending';
        if(migrated.receivingNo===undefined) migrated.receivingNo = nextReceivingNumber();
        return migrated;
      });
    }
    if(saved.manpower){
      state.manpower = saved.manpower.map(p=>{
        const migrated = Object.assign({}, p);
        if(migrated.machineId && !validMachineIds.has(migrated.machineId)) migrated.machineId = null;
        if(migrated.type===undefined || migrated.type===null || migrated.type==='') migrated.type = 'operator';
        if(migrated.startTime===undefined) migrated.startTime = '';
        if(migrated.endTime===undefined) migrated.endTime = '';
        return migrated;
      });
    }
    return true;
}

async function loadState(){
  // Prefer the cloud copy (shared across every device) when configured.
  if(CLOUD_ENABLED){
    const remote = await pullStateFromCloud();
    if(remote && remote.data){
      try{
        lastSyncedAt = remote.updated_at;
        return applyLoadedData(remote.data);
      }catch(e){ console.warn('Could not apply cloud data, falling back to local', e); }
    }
    // Nothing usable in the cloud yet — fall through and seed it from whatever's on this device.
  }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    return applyLoadedData(saved);
  }catch(e){ console.warn('Could not load saved data', e); return false; }
}

async function resetToSampleData(){
  if(!confirm('This clears your saved edits and restores the original sample data. Continue?')) return;
  localStorage.removeItem(STORAGE_KEY);
  if(CLOUD_ENABLED){
    try{
      const { error } = await sb.from(SUPABASE_TABLE).delete().eq('id', SUPABASE_ROW_ID);
      if(error) throw error;
    }catch(e){
      console.warn('Could not clear cloud data', e);
      alert("Cleared this device's data, but couldn't reach the cloud to clear the shared copy — it may reappear after reload. Check your connection and try again.");
      return;
    }
  }
  location.reload();
}

/* ================= MAIN RENDER ================= */
function getFocusKey(el){
  if(!el || el===document.body) return null;
  if(el.dataset && el.dataset.order && el.dataset.field) return {type:'order', order:el.dataset.order, field:el.dataset.field};
  if(el.dataset && el.dataset.idx && el.dataset.field) return {type:'inv', idx:el.dataset.idx, field:el.dataset.field};
  if(el.id) return {type:'id', id:el.id};
  return null;
}
function findByFocusKey(key){
  if(!key) return null;
  if(key.type==='order') return document.querySelector(`[data-order="${key.order}"][data-field="${key.field}"]`);
  if(key.type==='inv') return document.querySelector(`[data-idx="${key.idx}"][data-field="${key.field}"]`);
  if(key.type==='id') return document.getElementById(key.id);
  return null;
}

function render(){
  const prevScrollEl = document.querySelector('[data-scroll-preserve]');
  const prevScrollLeft = prevScrollEl ? prevScrollEl.scrollLeft : 0;
  const prevScrollTop = prevScrollEl ? prevScrollEl.scrollTop : 0;
  const prevPageScrollY = window.scrollY;
  const activeKey = getFocusKey(document.activeElement);
  const activeSelStart = document.activeElement && typeof document.activeElement.selectionStart === 'number' ? document.activeElement.selectionStart : null;

  renderNav();
  if(state.view==='dashboard') renderDashboard();
  else if(state.view==='progress') renderProgress();
  else if(state.view==='manpower') renderManpower();
  else if(state.view==='map') renderMap();
  else if(state.view==='receiving') renderReceiving();
  else if(state.view==='dispatch') renderDispatch();
  else if(state.view==='errors') renderErrors();
  else if(state.view==='logbook') renderLogbook();
  else if(state.view==='inventory') renderInventory();
  saveState();

  const newScrollEl = document.querySelector('[data-scroll-preserve]');
  if(newScrollEl){ newScrollEl.scrollLeft = prevScrollLeft; newScrollEl.scrollTop = prevScrollTop; }
  window.scrollTo(0, prevPageScrollY);
  if(activeKey){
    const el = findByFocusKey(activeKey);
    if(el){
      el.focus({preventScroll:true});
      if(activeSelStart!==null && el.setSelectionRange && (el.type==='text' || el.type==='search')){
        try{ el.setSelectionRange(activeSelStart, activeSelStart); }catch(e){}
      }
    }
  }
}

/* ---- mobile sidebar drawer (hamburger toggle) ----
   Below the 880px breakpoint #sidebar becomes an off-canvas drawer (see
   CSS); this just flips the class that slides it in/out and taps the
   backdrop or a nav choice to close it again. ---- */
function openSidebar(){ document.body.classList.add('sidebar-open'); }
function closeSidebar(){ document.body.classList.remove('sidebar-open'); }
$('#menu-toggle').addEventListener('click', ()=>{
  document.body.classList.contains('sidebar-open') ? closeSidebar() : openSidebar();
});
$('#sidebar-backdrop').addEventListener('click', closeSidebar);

(async function init(){
  const hadSavedData = await loadState();
  render();
  tickClock();
  setInterval(tickClock, 30000);
  $('#reset-btn').addEventListener('click', resetToSampleData);
  startCloudPolling();
})();
</script>
